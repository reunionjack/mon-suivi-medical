<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Suivi de mes ordonnances</title>
    
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">
    <meta name="apple-mobile-web-app-status-bar-style" content="#0f172a">
    <meta name="theme-color" content="#0284c7">

    <style>
        :root { --p: #0284c7; --s: #10b981; --bg: #0f172a; --c: #1e293b; --txt: #f1f5f9; --warn: #f43f5e; --gold: #eab308; }
        * { box-sizing: border-box; font-family: system-ui, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: var(--txt); margin: 0; padding: 10px; padding-bottom: 50px; }
        
        .app-header { 
            display: grid;
            grid-template-columns: 1fr auto 1fr; 
            align-items: center; 
            padding: 5px; 
            margin-bottom: 10px; 
            height: 70px;
            width: 100%;
        }
        .header-left { display: flex; justify-content: flex-start; }
        .header-logo { height: 28px; width: auto; object-fit: contain; }
        .header-center { display: flex; align-items: center; justify-content: center; }
        .app-title { 
            color: var(--p); font-weight: 900; font-size: 1.1rem;
            text-transform: uppercase; margin: 0; line-height: 1.2; text-align: center;
        }
        .header-right { display: flex; gap: 8px; align-items: center; justify-content: flex-end; }
        
        .btn-reset { background: var(--warn); border: none; color: white; border-radius: 20px; padding: 0 10px; font-size: 0.65rem; font-weight: bold; height: 30px; display: flex; align-items: center; }
        .btn-notif { background: #475569; border: none; color: white; border-radius: 50%; width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; }
        .btn-notif.active { background: var(--s); }
        .action-bar { display: flex; gap: 8px; margin-bottom: 20px; }
        .btn-top { flex: 1; padding: 12px 5px; border-radius: 12px; border: none; font-weight: 700; font-size: 0.85rem; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; color: white; box-shadow: 0 4px 6px rgba(0,0,0,0.1); transition: all 0.2s; }
        .bg-blue { background: var(--p); } .bg-red { background: var(--warn); } .bg-gray { background: #475569; }
        .med-card { background: var(--c); padding: 15px; border-radius: 12px; margin-bottom: 10px; border-left: 8px solid #475569; display: flex; align-items: center; gap: 15px; }
        .med-card.completed { opacity: 0.4; filter: grayscale(1); }
        .brd-matin { border-left-color: var(--gold); } .brd-midi { border-left-color: #38bdf8; } .brd-soir { border-left-color: #f97316; } .brd-coucher { border-left-color: #6366f1; } .brd-crise { border-left-color: var(--warn); }
        .chk { width: 32px; height: 32px; min-width: 32px; accent-color: var(--s); }
        .med-info { flex: 1; }
        .med-name-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
        .med-name { font-weight: 700; color: white; font-size: 1.1rem; flex: 1; }
        .order-buttons { display: flex; gap: 4px; }
        .med-meta { font-size: 0.85rem; color: #94a3b8; }
        .date-nav { display: flex; align-items: center; justify-content: center; gap: 20px; margin-bottom: 20px; background: var(--c); padding: 12px; border-radius: 50px; }
        .date-nav button { background: #334155; border: none; color: #38bdf8; width: 40px; height: 40px; border-radius: 50%; font-size: 1.2rem; }
        .admin-panel { display: none; background: var(--c); padding: 20px; border-radius: 12px; border: 2px solid var(--p); margin-bottom: 15px; }
        input { width: 100%; padding: 14px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: white; margin-top: 5px; }
        .period-selector { display: flex; gap: 5px; margin-top: 10px; }
        .p-btn { flex: 1; padding: 10px 2px; border-radius: 8px; border: 1px solid #334155; background: #1e293b; color: white; font-size: 0.65rem; }
        .act-Matin { background: var(--gold) !important; color: #000 !important; font-weight: bold; }
        .act-Midi { background: #38bdf8 !important; color: #000 !important; font-weight: bold; }
        .act-Soir { background: #f97316 !important; color: #fff !important; font-weight: bold; }
        .act-Coucher { background: #6366f1 !important; color: #fff !important; font-weight: bold; }
        .act-Crise { background: var(--warn) !important; color: #fff !important; font-weight: bold; }
        .days-left { background: var(--p); color: white; padding: 2px 8px; border-radius: 12px; font-size: 0.75rem; font-weight: bold; margin-left: 8px; }
        .order-btn { background: #475569; border: none; color: white; padding: 8px 12px; border-radius: 8px; font-size: 1.1rem; cursor: pointer; margin-left: 4px; font-weight: bold; min-width: 40px; transition: all 0.2s; }
        .order-btn:active { background: var(--p); transform: scale(0.95); }

        @media (min-width: 768px) {
            .header-logo { height: 40px; }
            .app-title { font-size: 1.5rem; }
        }
    </style>
</head>
<body>

    <div class="app-header">
        <div class="header-left">
            <img src="Logo3.png" alt="Logo" class="header-logo" onerror="this.style.display='none'">
        </div>
        <div class="header-center">
            <h1 class="app-title">Suivi de mes ordonnances</h1>
        </div>
        <div class="header-right">
            <button id="notifBtn" class="btn-notif" onclick="toggleNotifications()">🔔</button>
            <button class="btn-reset" onclick="if(confirm('Tout effacer ?')){localStorage.clear();location.reload();}">RESET</button>
        </div>
    </div>

    <div class="action-bar">
        <button class="btn-top bg-blue" onclick="openForm()"><span>➕ Ajouter</span></button>
        <button class="btn-top bg-red" onclick="showCrisePanel()"><span>🚨 Crise</span></button>
        <button class="btn-top bg-gray" onclick="toggleConfig()"><span>🔧 Gérer</span></button>
    </div>

    <div id="mainUI">
        <div class="date-nav">
            <button onclick="changeDate(-1)">❮</button>
            <b id="dateDisplay">Aujourd'hui</b>
            <button onclick="changeDate(1)">❯</button>
        </div>
        <div id="list"></div>
    </div>

    <div id="configPanel" class="admin-panel">
        <h3 style="margin:0 0 15px 0;">🔧 Liste des traitements</h3>
        <div id="configList"></div>
        <button class="btn-top bg-gray" style="width:100%; margin-top:15px" onclick="closePanels()">FERMER</button>
    </div>

    <div id="adminPanel" class="admin-panel">
        <input type="hidden" id="editGroupId">
        <label>Nom du médicament</label><input type="text" id="name">
        <label>Date de début</label><input type="date" id="startDay">
        <div id="classicFields">
            <label>Durée (jours)</label><input type="number" id="jours" value="30">
        </div>
        <label>Moments de prise</label>
        <div class="period-selector">
            <button class="p-btn" data-p="Matin" onclick="toggleP(this)">Matin</button>
            <button class="p-btn" data-p="Midi" onclick="toggleP(this)">Midi</button>
            <button class="p-btn" data-p="Soir" onclick="toggleP(this)">Soir</button>
            <button class="p-btn" data-p="Coucher" onclick="toggleP(this)">Couch.</button>
            <button class="p-btn" data-p="Crise" onclick="toggleP(this, true)">🚨 Crise</button>
        </div>
        
        <div style="margin-top: 15px; padding: 15px; background: #0f172a; border-radius: 8px; border: 2px solid #334155;">
            <label style="font-weight: bold; color: var(--p); margin-bottom: 10px; display: block;">⏰ Heures de prise</label>
            
            <div style="display: flex; align-items: center; justify-content: space-between; padding: 10px; margin: 5px 0; background: #1e293b; border-radius: 6px;" id="time-row-Matin">
                <span style="font-weight: 600; color: #94a3b8; min-width: 80px;">☀️ Matin :</span>
                <input type="time" id="time-Matin" value="08:00" min="00:00" max="11:59" style="padding: 8px; width: 120px; text-align: center;">
            </div>
            
            <div style="display: flex; align-items: center; justify-content: space-between; padding: 10px; margin: 5px 0; background: #1e293b; border-radius: 6px;" id="time-row-Midi">
                <span style="font-weight: 600; color: #94a3b8; min-width: 80px;">🕛 Midi :</span>
                <input type="time" id="time-Midi" value="12:00" min="12:00" max="17:59" style="padding: 8px; width: 120px; text-align: center;">
            </div>
            
            <div style="display: flex; align-items: center; justify-content: space-between; padding: 10px; margin: 5px 0; background: #1e293b; border-radius: 6px;" id="time-row-Soir">
                <span style="font-weight: 600; color: #94a3b8; min-width: 80px;">🌙 Soir :</span>
                <input type="time" id="time-Soir" value="19:00" min="18:00" max="23:59" style="padding: 8px; width: 120px; text-align: center;">
            </div>
            
            <div style="display: flex; align-items: center; justify-content: space-between; padding: 10px; margin: 5px 0; background: #1e293b; border-radius: 6px;" id="time-row-Coucher">
                <span style="font-weight: 600; color: #94a3b8; min-width: 80px;">🛌 Coucher :</span>
                <input type="time" id="time-Coucher" value="22:00" min="19:00" max="23:59" style="padding: 8px; width: 120px; text-align: center;">
            </div>
        </div>
        
        <button class="btn-top bg-blue" style="width:100%; height:50px; margin-top:20px; margin-bottom:10px" onclick="saveMed()">ENREGISTRER</button>
        <button class="btn-top bg-gray" style="width:100%" onclick="closePanels()">ANNULER</button>
    </div>

    <div id="crisePanel" class="admin-panel" style="border-color: var(--warn);">
        <h3 style="margin:0 0 15px 0; color:var(--warn)">🚨 Enregistrer une crise</h3>
        <label>Date de la prise</label><input type="date" id="criseRetroDate">
        <div id="criseChoices" style="margin-top:15px"></div>
        <button class="btn-top bg-gray" style="width:100%; margin-top:10px; padding: 15px; font-size: 1rem;" onclick="closePanels()">❌ ANNULER</button>
    </div>

<script>
    let swRegistration = null;
    let notifInterval = null;
    let notifLog = JSON.parse(localStorage.getItem('notif_log_v1') || "{}");

    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('sw.js').then(reg => {
                swRegistration = reg;
                setupNotificationScheduler();
            });
        });
    }

    let curD = new Date(); curD.setHours(0,0,0,0);
    let meds = JSON.parse(localStorage.getItem('meds_v18') || "[]");
    let hist = JSON.parse(localStorage.getItem('hist_v18') || "{}");
    let notifsEnabled = localStorage.getItem('notifs_active') === 'true';

    function toggleNotifications() {
        if (!("Notification" in window)) return alert("Notifications non supportées.");
        if (notifsEnabled) {
            notifsEnabled = false;
            localStorage.setItem('notifs_active', 'false');
            updateNotifBtn();
            setupNotificationScheduler();
            return;
        }
        Notification.requestPermission().then(permission => {
            if (permission === "granted") {
                notifsEnabled = true;
                localStorage.setItem('notifs_active', 'true');
                updateNotifBtn();
                setupNotificationScheduler();
            }
        });
    }

    function updateNotifBtn() {
        const btn = document.getElementById('notifBtn');
        if (btn) {
            btn.classList.toggle('active', notifsEnabled);
            btn.innerHTML = notifsEnabled ? "🔔" : "🔕";
        }
    }

    function normalizeTime(value, fallbackHour) {
        if (typeof value === 'string' && /^\d{2}:\d{2}$/.test(value)) return value;
        const hour = Number.isFinite(fallbackHour) ? fallbackHour : 8;
        return String(hour).padStart(2, '0') + ':00';
    }

    function getMedTime(m) {
        if (m && m.p !== 'Crise') return normalizeTime(m.t, m.h);
        return null;
    }

    function canNotify(m, todayKey) {
        if (!m || m.p === 'Crise') return false;
        const diff = Math.round((parseDateLocal(todayKey) - parseDateLocal(m.s)) / 86400000);
        if (diff < 0 || (m.d - diff) <= 0) return false;
        if (hist[todayKey] && hist[todayKey][m.id]) return false;
        if (!notifLog[todayKey]) notifLog[todayKey] = {};
        return !notifLog[todayKey][m.id];
    }

    function sendNotification(title, body) {
        if (swRegistration && swRegistration.active) {
            swRegistration.active.postMessage({ type: 'SCHEDULE_NOTIF', title, body });
            return;
        }
        if (Notification.permission === 'granted') {
            new Notification(title, { body, icon: 'icon-192.png' });
        }
    }

    function checkNotifications() {
        if (!notifsEnabled || Notification.permission !== 'granted') return;
        const now = new Date();
        const todayKey = now.toLocaleDateString('en-CA');
        meds.forEach(m => {
            const medTime = getMedTime(m);
            if (!medTime || !canNotify(m, todayKey)) return;
            const [hours, minutes] = medTime.split(':').map(Number);
            const due = new Date();
            due.setHours(hours, minutes, 0, 0);
            if (now >= due) {
                const icon = m.p==='Matin'?'☀️':m.p==='Midi'?'🕛':m.p==='Soir'?'🌙':m.p==='Coucher'?'🛌':'💊';
                sendNotification(`${icon} ${m.n}`, `Prévu à ${medTime} (${m.p}).`);
                notifLog[todayKey][m.id] = true;
            }
        });
        localStorage.setItem('notif_log_v1', JSON.stringify(notifLog));
    }

    function setupNotificationScheduler() {
        if (notifInterval) clearInterval(notifInterval);
        if (!notifsEnabled || Notification.permission !== 'granted') return;
        checkNotifications();
        notifInterval = setInterval(checkNotifications, 60000);
    }

    function closePanels() {
        document.querySelectorAll('.admin-panel').forEach(p => p.style.display='none');
        document.getElementById('mainUI').style.display='block';
        render();
    }

    function handleCardClick(event, gid) {
        if (!event || !event.target) { openForm(gid); return; }
        if (!['BUTTON','INPUT'].includes(event.target.tagName)) openForm(gid);
    }

    function handleMove(event, id, dir) {
        if (event) event.stopPropagation();
        moveMed(id, dir);
    }

    function handleCheck(event, dateKey, id) {
        if (event) event.stopPropagation();
        if (!hist[dateKey]) hist[dateKey] = {};
        hist[dateKey][id] = event.target.checked
            ? new Date().toLocaleTimeString('fr-FR', {hour:'2-digit', minute:'2-digit'})
            : null;
        localStorage.setItem('hist_v18', JSON.stringify(hist));
        render();
    }

    function changeDate(n) { curD.setDate(curD.getDate() + n); render(); }

    function toggleP(btn, isCrise) {
        if (isCrise) {
            document.querySelectorAll('.p-btn').forEach(b => b.classList.remove('act-Matin','act-Midi','act-Soir','act-Coucher','act-Crise'));
            btn.classList.add('act-Crise');
            document.getElementById('classicFields').style.display = 'none';
        } else {
            document.querySelector('[data-p="Crise"]').classList.remove('act-Crise');
            btn.classList.toggle('act-' + btn.dataset.p);
            document.getElementById('classicFields').style.display = 'block';
        }
    }

    function toggleConfig() {
        document.getElementById('mainUI').style.display = 'none';
        const list = document.getElementById('configList'); list.innerHTML = "";
        const groups = {}; meds.forEach(m => { if(!groups[m.gid]) groups[m.gid] = m; });
        Object.values(groups).forEach(m => {
            list.innerHTML += `<div style="display:flex; justify-content:space-between; padding:12px; background:#1e293b; margin-bottom:8px; border-radius:10px; align-items:center; border-left:4px solid var(--p);"><span style="font-weight:bold; color:white;">${m.n}</span><div><button style="background:var(--p); color:white; border:none; padding:8px 12px; border-radius:8px; font-weight:bold; cursor:pointer;" onclick="openForm(${m.gid})">Modifier</button><button style="background:var(--warn); border:none; padding:8px; border-radius:8px; color:white; margin-left:5px; cursor:pointer;" onclick="deleteMed(${m.gid})">🗑️</button></div></div>`;
        });
        document.getElementById('configPanel').style.display = 'block';
    }

    function deleteMed(gid) {
        if (confirm("Supprimer ?")) {
            meds = meds.filter(m => m.gid !== gid);
            localStorage.setItem('meds_v18', JSON.stringify(meds));
            toggleConfig();
        }
    }

    function openForm(gid = null) {
        document.getElementById('mainUI').style.display = 'none';
        document.querySelectorAll('.admin-panel').forEach(p => p.style.display='none');
        document.getElementById('adminPanel').style.display = 'block';
        if (gid) {
            const g = meds.filter(m => m.gid === gid);
            document.getElementById('editGroupId').value = gid;
            document.getElementById('name').value = g[0].n;
            document.getElementById('startDay').value = g[0].s;
            document.getElementById('jours').value = g[0].d;
            g.forEach(m => {
                const b = document.querySelector(`[data-p="${m.p}"]`);
                if (b) b.classList.add('act-'+m.p);
                if (m.p !== 'Crise') {
                    const timeInput = document.getElementById(`time-${m.p}`);
                    if (timeInput && m.t) timeInput.value = m.t;
                }
            });
            document.getElementById('classicFields').style.display = (g[0].p === 'Crise') ? 'none' : 'block';
        } else {
            document.getElementById('editGroupId').value = "";
            document.getElementById('name').value = "";
            document.getElementById('startDay').value = curD.toLocaleDateString('en-CA');
            document.getElementById('classicFields').style.display = 'block';
            document.querySelectorAll('.p-btn').forEach(b => b.classList.remove('act-Matin','act-Midi','act-Soir','act-Coucher','act-Crise'));
            document.getElementById('time-Matin').value = '08:00';
            document.getElementById('time-Midi').value = '12:00';
            document.getElementById('time-Soir').value = '19:00';
            document.getElementById('time-Coucher').value = '22:00';
        }
    }

    function saveMed() {
        const name = document.getElementById('name').value;
        const selected = Array.from(document.querySelectorAll('.p-btn[class*="act-"]')).map(b => b.dataset.p);
        if (!name || selected.length === 0) return alert("Nom et moment requis.");

        const timeRanges = {
            'Matin':   { min: '00:00', max: '11:59' },
            'Midi':    { min: '12:00', max: '17:59' },
            'Soir':    { min: '18:00', max: '23:59' },
            'Coucher': { min: '19:00', max: '23:59' }
        };

        for (let p of selected) {
            if (p === 'Crise') continue;
            const timeInput = document.getElementById(`time-${p}`);
            if (timeInput && timeInput.value) {
                const inputTime = timeInput.value;
                const range = timeRanges[p];
                if (inputTime < range.min || inputTime > range.max) {
                    alert(`❌ ERREUR: L'heure ${inputTime} n'est pas valide pour "${p}".\n\nHeures autorisées pour ${p}: ${range.min} - ${range.max}`);
                    return;
                }
            }
        }

        const gid = document.getElementById('editGroupId').value ? parseFloat(document.getElementById('editGroupId').value) : Date.now();
        let existing = meds.filter(m => m.gid === gid);
        meds = meds.filter(m => m.gid !== gid);

        selected.forEach(p => {
            const old = existing.find(ex => ex.p === p);
            let customTime = null;
            let customHour = null;
            if (p !== 'Crise') {
                const timeInput = document.getElementById(`time-${p}`);
                if (timeInput && timeInput.value) {
                    customTime = timeInput.value;
                    customHour = parseInt(timeInput.value.split(':')[0]);
                }
            }
            const defaultHours = {'Matin':8, 'Midi':12, 'Soir':19, 'Coucher':22};
            const defaultTimes = {'Matin':'08:00', 'Midi':'12:00', 'Soir':'19:00', 'Coucher':'22:00'};
            meds.push({
                id: old ? old.id : (Date.now() + Math.random()),
                gid: gid,
                n: name,
                p: p,
                s: document.getElementById('startDay').value,
                d: (p === 'Crise') ? 9999 : parseInt(document.getElementById('jours').value),
                h: customHour !== null ? customHour : (old ? old.h : defaultHours[p] || 23),
                t: customTime || (old ? old.t : defaultTimes[p] || 'Libre'),
                o: old ? old.o : Date.now()
            });
        });
        localStorage.setItem('meds_v18', JSON.stringify(meds));
        closePanels();
    }

    function moveMed(id, dir) {
        const m = meds.find(x => x.id === id);
        if (!m) return;
        const sameCat = meds.filter(x => x.p === m.p).sort((a,b) => a.o - b.o);
        const idx = sameCat.findIndex(x => x.id === id);
        if (dir === -1 && idx > 0) {
            const temp = sameCat[idx].o; sameCat[idx].o = sameCat[idx-1].o; sameCat[idx-1].o = temp;
        } else if (dir === 1 && idx < sameCat.length - 1) {
            const temp = sameCat[idx].o; sameCat[idx].o = sameCat[idx+1].o; sameCat[idx+1].o = temp;
        }
        localStorage.setItem('meds_v18', JSON.stringify(meds));
        render();
    }

    function showCrisePanel() {
        document.getElementById('mainUI').style.display = 'none';
        document.querySelectorAll('.admin-panel').forEach(p => p.style.display='none');
        document.getElementById('criseRetroDate').value = curD.toLocaleDateString('en-CA');
        const container = document.getElementById('criseChoices'); container.innerHTML = "";
        meds.filter(m => m.p === 'Crise').forEach(m => {
            const btn = document.createElement('button');
            btn.className = "btn-top bg-blue"; btn.style.width = "100%"; btn.style.marginBottom = "10px";
            btn.innerText = "🚨 Prise : " + m.n;
            btn.onclick = () => {
                const d = document.getElementById('criseRetroDate').value;
                if (!hist[d]) hist[d] = {};
                hist[d][m.id] = new Date().toLocaleTimeString('fr-FR', {hour:'2-digit', minute:'2-digit'});
                localStorage.setItem('hist_v18', JSON.stringify(hist));
                closePanels();
            };
            container.appendChild(btn);
        });
        document.getElementById('crisePanel').style.display = 'block';
    }

    function parseDateLocal(s) { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); }

    function render() {
        const k = curD.toLocaleDateString('en-CA');
        document.getElementById('dateDisplay').innerText = (k === new Date().toLocaleDateString('en-CA')) ? "Aujourd'hui" : curD.toLocaleDateString('fr-FR', {day:'numeric', month:'short'});
        const listDiv = document.getElementById('list'); listDiv.innerHTML = "";
        meds.sort((a, b) => a.h - b.h || a.o - b.o);
        meds.forEach(m => {
            const val = hist[k] && hist[k][m.id];
            if (m.p === 'Crise' && !val) return;
            const diff = Math.round((parseDateLocal(k) - parseDateLocal(m.s)) / 86400000);
            if (m.p !== 'Crise' && (diff < 0 || (m.d - diff) <= 0)) return;
            if (m.p === 'Crise' && diff < 0) return;
            const rem = m.d - diff;
            const icon = m.p==='Matin'?'☀️':m.p==='Midi'?'🕛':m.p==='Soir'?'🌙':m.p==='Coucher'?'🛌':'🚨';
            listDiv.innerHTML += `<div class="med-card brd-${m.p.toLowerCase()} ${val ? 'completed' : ''}" onclick="handleCardClick(event, ${m.gid})"><input type="checkbox" class="chk" ${val?'checked':''} onchange="handleCheck(event, '${k}', ${m.id})"><div class="med-info"><div class="med-name-row"><div class="med-name">${m.n}</div><div class="order-buttons"><button type="button" class="order-btn" onclick="handleMove(event, ${m.id}, -1)">↑</button><button type="button" class="order-btn" onclick="handleMove(event, ${m.id}, 1)">↓</button></div></div><div class="med-meta"><span>${icon} ${m.p} • ${val ? 'Pris à ' + val : 'Prévu à ' + m.t}</span>${m.p!=='Crise'?`<span class="days-left">J-${rem}</span>`:''}</div></div></div>`;
        });
        updateNotifBtn();
        setupNotificationScheduler();
    }

    render();
</script>
</body>
</html>
