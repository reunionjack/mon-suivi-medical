<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Suivi de mes ordonnances</title>
    
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">
    <meta name="apple-mobile-web-app-status-bar-style" content="#0f172a">
    <meta name="theme-color" content="#0284c7">

    <style>
        :root { --p: #0284c7; --s: #10b981; --bg: #0f172a; --c: #1e293b; --txt: #f1f5f9; --warn: #f43f5e; --gold: #eab308; }
        * { box-sizing: border-box; font-family: system-ui, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: var(--txt); margin: 0; padding: 10px; padding-bottom: 50px; }
        
        /* --- HEADER : LOGO À GAUCHE, TITRE CENTRÉ --- */
        .app-header { 
            display: grid;
            grid-template-columns: 1fr auto 1fr; 
            align-items: center; 
            padding: 5px; 
            margin-bottom: 10px; 
            height: 70px;
            width: 100%;
        }
        
        .header-left { display: flex; justify-content: flex-start; }

        .header-logo { 
            height: 28px; 
            width: auto; 
            object-fit: contain; 
        }
        
        .header-center {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .app-title { 
            color: var(--p); 
            font-weight: 900; 
            font-size: 1.1rem; /* Taille adaptée pour le titre long */
            text-transform: uppercase; 
            margin: 0;
            line-height: 1.2;
            text-align: center;
        }
        
        .header-right { 
            display: flex; 
            gap: 8px; 
            align-items: center; 
            justify-content: flex-end;
        }
        
        /* Tes styles originaux */
        .btn-reset { background: var(--warn); border: none; color: white; border-radius: 20px; padding: 0 10px; font-size: 0.65rem; font-weight: bold; height: 30px; display: flex; align-items: center; }
        .btn-notif { background: #475569; border: none; color: white; border-radius: 50%; width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; }
        .btn-notif.active { background: var(--s); }
        .action-bar { display: flex; gap: 8px; margin-bottom: 20px; }
        .btn-top { flex: 1; padding: 12px 5px; border-radius: 12px; border: none; font-weight: 700; font-size: 0.85rem; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; color: white; box-shadow: 0 4px 6px rgba(0,0,0,0.1); transition: all 0.2s; }
        .bg-blue { background: var(--p); } .bg-red { background: var(--warn); } .bg-gray { background: #475569; }
        .med-card { background: var(--c); padding: 15px; border-radius: 12px; margin-bottom: 10px; border-left: 8px solid #475569; display: flex; align-items: center; gap: 15px; }
        .med-card.completed { opacity: 0.4; filter: grayscale(1); }
        .brd-matin { border-left-color: var(--gold); } .brd-midi { border-left-color: #38bdf8; } .brd-soir { border-left-color: #f97316; } .brd-coucher { border-left-color: #6366f1; } .brd-crise { border-left-color: var(--warn); }
        .chk { width: 32px; height: 32px; min-width: 32px; accent-color: var(--s); }
        .med-info { flex: 1; }
        .med-name-row { display: flex; align-items: center; justify-content: space-between; }
        .med-name { font-weight: 700; color: white; font-size: 1.1rem; }
        .med-meta { font-size: 0.85rem; color: #94a3b8; }
        .date-nav { display: flex; align-items: center; justify-content: center; gap: 20px; margin-bottom: 20px; background: var(--c); padding: 12px; border-radius: 50px; }
        .date-nav button { background: #334155; border: none; color: #38bdf8; width: 40px; height: 40px; border-radius: 50%; font-size: 1.2rem; }
        .admin-panel { display: none; background: var(--c); padding: 20px; border-radius: 12px; border: 2px solid var(--p); margin-bottom: 15px; }
        input { width: 100%; padding: 14px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: white; margin-top: 5px; }
        .period-selector { display: flex; gap: 5px; margin-top: 10px; }
        .p-btn { flex: 1; padding: 10px 2px; border-radius: 8px; border: 1px solid #334155; background: #1e293b; color: white; font-size: 0.65rem; }
        .act-Matin { background: var(--gold) !important; color: #000 !important; font-weight: bold; } 
        .act-Crise { background: var(--warn) !important; color: #fff !important; font-weight: bold; }

        @media (min-width: 768px) {
            .header-logo { height: 40px; }
            .app-title { font-size: 1.5rem; }
        }
    </style>
</head>
<body>

    <div class="app-header">
        <div class="header-left">
            <img src="Logo3.png" alt="Logo" class="header-logo" onerror="this.style.display='none'">
        </div>

        <div class="header-center">
            <h1 class="app-title">Suivi de mes ordonnances</h1>
        </div>

        <div class="header-right">
            <button id="notifBtn" class="btn-notif" onclick="toggleNotifications()">🔔</button>
            <button class="btn-reset" onclick="if(confirm('Tout effacer ?')){localStorage.clear();location.reload();}">RESET</button>
        </div>
    </div>

    <div class="action-bar">
        <button class="btn-top bg-blue" onclick="openForm()"><span>➕ Ajouter</span></button>
        <button class="btn-top bg-red" onclick="showCrisePanel()"><span>🚨 Crise</span></button>
        <button class="btn-top bg-gray" onclick="toggleConfig()"><span>🔧 Gérer</span></button>
    </div>

    <div id="mainUI">
        <div class="date-nav">
            <button onclick="changeDate(-1)">❮</button>
            <b id="dateDisplay">Aujourd'hui</b>
            <button onclick="changeDate(1)">❯</button>
        </div>
        <div id="list"></div>
    </div>

    <div id="configPanel" class="admin-panel">
        <h3 style="margin:0 0 15px 0;">🔧 Liste des traitements</h3>
        <div id="configList"></div>
        <button class="btn-top bg-gray" style="width:100%; margin-top:15px" onclick="closePanels()">FERMER</button>
    </div>

    <div id="adminPanel" class="admin-panel">
        <input type="hidden" id="editGroupId">
        <label>Nom du médicament</label><input type="text" id="name">
        <label>Date de début</label><input type="date" id="startDay">
        <div id="classicFields">
            <label>Durée (jours)</label><input type="number" id="jours" value="30">
        </div>
        <label>Moments de prise</label>
        <div class="period-selector">
            <button class="p-btn" data-p="Matin" onclick="toggleP(this)">Matin</button>
            <button class="p-btn" data-p="Midi" onclick="toggleP(this)">Midi</button>
            <button class="p-btn" data-p="Soir" onclick="toggleP(this)">Soir</button>
            <button class="p-btn" data-p="Coucher" onclick="toggleP(this)">Couch.</button>
            <button class="p-btn" data-p="Crise" onclick="toggleP(this, true)">🚨 Crise</button>
        </div>
        <button class="btn-top bg-blue" style="width:100%; height:50px; margin-top:20px; margin-bottom:10px" onclick="saveMed()">ENREGISTRER</button>
        <button class="btn-top bg-gray" style="width:100%" onclick="closePanels()">ANNULER</button>
    </div>

    <div id="crisePanel" class="admin-panel" style="border-color: var(--warn);">
        <h3 style="margin:0 0 15px 0; color:var(--warn)">🚨 Enregistrer une crise</h3>
        <label>Date de la prise</label><input type="date" id="criseRetroDate">
        <div id="criseChoices" style="margin-top:15px"></div>
        <button class="btn-top bg-gray" style="width:100%; margin-top:10px" onclick="closePanels()">ANNULER</button>
    </div>

<script>
    if ('serviceWorker' in navigator) { window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js'); }); }
    let curD = new Date(); curD.setHours(0,0,0,0);
    let meds = JSON.parse(localStorage.getItem('meds_v18') || "[]");
    let hist = JSON.parse(localStorage.getItem('hist_v18') || "{}");
    let notifsEnabled = localStorage.getItem('notifs_active') === 'true';

    function toggleNotifications() {
        if (!("Notification" in window)) return alert("Notifications non supportées.");
        Notification.requestPermission().then(permission => {
            if (permission === "granted") {
                notifsEnabled = !notifsEnabled;
                localStorage.setItem('notifs_active', notifsEnabled);
                updateNotifBtn();
            }
        });
    }

    function updateNotifBtn() {
        const btn = document.getElementById('notifBtn');
        if(btn) {
            btn.classList.toggle('active', notifsEnabled);
            btn.innerHTML = notifsEnabled ? "🔔" : "🔕";
        }
    }

    function closePanels() { document.querySelectorAll('.admin-panel').forEach(p => p.style.display='none'); document.getElementById('mainUI').style.display='block'; render(); }
    function changeDate(n) { curD.setDate(curD.getDate() + n); render(); }
    function toggleP(btn, isCrise) {
        if(isCrise) { document.querySelectorAll('.p-btn').forEach(b => b.classList.remove('act-Matin','act-Midi','act-Soir','act-Coucher','act-Crise')); btn.classList.add('act-Crise'); document.getElementById('classicFields').style.display = 'none'; }
        else { document.querySelector('[data-p="Crise"]').classList.remove('act-Crise'); btn.classList.toggle('act-' + btn.dataset.p); document.getElementById('classicFields').style.display = 'block'; }
    }
    
    function toggleConfig() {
        document.getElementById('mainUI').style.display = 'none';
        const list = document.getElementById('configList'); list.innerHTML = "";
        const groups = {}; meds.forEach(m => { if(!groups[m.gid]) groups[m.gid] = m; });
        Object.values(groups).forEach(m => {
            list.innerHTML += `<div style="display:flex; justify-content:space-between; padding:12px; background:#1e293b; margin-bottom:8px; border-radius:10px; align-items:center; border-left:4px solid var(--p);"><span style="font-weight:bold; color:white;">${m.n}</span><div><button style="background:var(--p); color:white; border:none; padding:8px 12px; border-radius:8px; font-weight:bold; cursor:pointer;" onclick="openForm(${m.gid})">Modifier</button><button style="background:var(--warn); border:none; padding:8px; border-radius:8px; color:white; margin-left:5px; cursor:pointer;" onclick="deleteMed(${m.gid})">🗑️</button></div></div>`;
        });
        document.getElementById('configPanel').style.display = 'block';
    }

    function deleteMed(gid) { if(confirm("Supprimer ?")) { meds = meds.filter(m => m.gid !== gid); localStorage.setItem('meds_v18', JSON.stringify(meds)); toggleConfig(); } }
    function openForm(gid = null) {
        document.getElementById('mainUI').style.display = 'none';
        document.querySelectorAll('.admin-panel').forEach(p => p.style.display='none');
        document.getElementById('adminPanel').style.display = 'block';
        if(gid) {
            const g = meds.filter(m => m.gid === gid);
            document.getElementById('editGroupId').value = gid; document.getElementById('name').value = g[0].n; document.getElementById('startDay').value = g[0].s; document.getElementById('jours').value = g[0].d;
            g.forEach(m => { const b = document.querySelector(`[data-p="${m.p}"]`); if(b) b.classList.add('act-'+m.p); });
            document.getElementById('classicFields').style.display = (g[0].p === 'Crise') ? 'none' : 'block';
        } else {
            document.getElementById('editGroupId').value = ""; document.getElementById('name').value = ""; document.getElementById('startDay').value = curD.toLocaleDateString('en-CA'); document.getElementById('classicFields').style.display = 'block';
            document.querySelectorAll('.p-btn').forEach(b => b.classList.remove('act-Matin','act-Midi','act-Soir','act-Coucher','act-Crise'));
        }
    }

    function saveMed() {
        const name = document.getElementById('name').value;
        const selected = Array.from(document.querySelectorAll('.p-btn[class*="act-"]')).map(b => b.dataset.p);
        if(!name || selected.length === 0) return alert("Nom et moment requis.");
        const gid = document.getElementById('editGroupId').value ? parseFloat(document.getElementById('editGroupId').value) : Date.now();
        let existing = meds.filter(m => m.gid === gid); meds = meds.filter(m => m.gid !== gid);
        selected.forEach(p => {
            const old = existing.find(ex => ex.p === p);
            meds.push({ id: old ? old.id : (Date.now() + Math.random()), gid: gid, n: name, p: p, s: document.getElementById('startDay').value, d: (p === 'Crise') ? 9999 : parseInt(document.getElementById('jours').value), h: (p==='Matin'?8:p==='Midi'?12:p==='Soir'?19:p==='Coucher'?22:23), t: (p==='Matin'?'08:00':p==='Midi'?'12:00':p==='Soir'?'19:00':p==='Coucher'?'22:00':'Libre'), o: old ? old.o : Date.now() });
        });
        localStorage.setItem('meds_v18', JSON.stringify(meds)); closePanels();
    }

    function moveMed(id, dir) {
        const m = meds.find(x => x.id === id); const sameCat = meds.filter(x => x.p === m.p).sort((a,b) => a.o - b.o); const idx = sameCat.findIndex(x => x.id === id);
        if (dir === -1 && idx > 0) [sameCat[idx].o, sameCat[idx-1].o] = [sameCat[idx-1].o, sameCat[idx].o];
        else if (dir === 1 && idx < sameCat.length - 1) [sameCat[idx].o, sameCat[idx+1].o] = [sameCat[idx+1].o, sameCat[idx].o];
        localStorage.setItem('meds_v18', JSON.stringify(meds)); render();
    }

    function showCrisePanel() {
        document.getElementById('mainUI').style.display = 'none'; document.querySelectorAll('.admin-panel').forEach(p => p.style.display='none');
        document.getElementById('criseRetroDate').value = curD.toLocaleDateString('en-CA');
        const container = document.getElementById('criseChoices'); container.innerHTML = "";
        meds.filter(m => m.p === 'Crise').forEach(m => {
            const btn = document.createElement('button'); btn.className = "btn-top bg-blue"; btn.style.width = "100%"; btn.style.marginBottom = "10px"; btn.innerText = "🚨 Prise : " + m.n;
            btn.onclick = () => { const d = document.getElementById('criseRetroDate').value; if(!hist[d]) hist[d] = {}; hist[d][m.id] = new Date().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}); localStorage.setItem('hist_v18', JSON.stringify(hist)); closePanels(); };
            container.appendChild(btn);
        });
        document.getElementById('crisePanel').style.display = 'block';
    }

    function parseDateLocal(s) { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); }

    function render() {
        const k = curD.toLocaleDateString('en-CA');
        document.getElementById('dateDisplay').innerText = (k === new Date().toLocaleDateString('en-CA')) ? "Aujourd'hui" : curD.toLocaleDateString('fr-FR', {day:'numeric', month:'short'});
        const listDiv = document.getElementById('list'); listDiv.innerHTML = "";
        meds.sort((a, b) => a.h - b.h || a.o - b.o);
        meds.forEach(m => {
            const val = hist[k] && hist[k][m.id]; if (m.p === 'Crise' && !val) return;
            const diff = Math.round((parseDateLocal(k) - parseDateLocal(m.s)) / 86400000);
            if (m.p !== 'Crise' && (diff < 0 || (m.d - diff) <= 0)) return;
            if (m.p === 'Crise' && diff < 0) return;
            const rem = m.d - diff; const icon = m.p==='Matin'?'☀️':m.p==='Midi'?'🕛':m.p==='Soir'?'🌙':m.p==='Coucher'?'🛌':'🚨';
            listDiv.innerHTML += `<div class="med-card brd-${m.p.toLowerCase()} ${val ? 'completed' : ''}" onclick="if(!['BUTTON','INPUT'].includes(event.target.tagName)) openForm(${m.gid})"><input type="checkbox" class="chk" ${val?'checked':''} onchange="const d='${k}'; if(!hist[d])hist[d]={}; hist[d][${m.id}]=this.checked ? new Date().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}) : null; localStorage.setItem('hist_v18',JSON.stringify(hist)); render(); event.stopPropagation();"><div class="med-info"><div class="med-name-row"><div class="med-name">${m.n}</div><div><button class="order-btn" onclick="event.stopPropagation(); moveMed(${m.id}, -1)">↑</button><button class="order-btn" onclick="event.stopPropagation(); moveMed(${m.id}, 1)">↓</button></div></div><div class="med-meta"><span>${icon} ${m.p} • ${val ? 'Pris à ' + val : 'Prévu à ' + m.t}</span>${m.p!=='Crise'?`<span class="days-left">J-${rem}</span>`:''}</div></div></div>`;
        });
        updateNotifBtn();
    }
    render();
</script>
</body>
</html>
