<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ma Pharmacie</title>
    <style>
        :root { --p: #0284c7; --s: #10b981; --bg: #0f172a; --c: #1e293b; --txt: #f1f5f9; --warn: #f43f5e; --gold: #eab308; }
        * { box-sizing: border-box; font-family: system-ui, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: var(--txt); margin: 0; padding: 10px; padding-bottom: 50px; }
        
        .app-header { display: flex; align-items: center; justify-content: center; gap: 10px; padding: 15px 0; }
        .app-title { color: var(--p); font-weight: 900; font-size: 1.5rem; text-transform: uppercase; }
        .btn-test { background: #475569; border: none; color: white; border-radius: 20px; padding: 5px 12px; cursor: pointer; font-size: 0.7rem; font-weight: bold; }

        .action-bar { display: flex; gap: 8px; margin-bottom: 20px; }
        .btn-top { flex: 1; padding: 12px 5px; border-radius: 12px; border: none; font-weight: 700; font-size: 0.8rem; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 5px; color: white; transition: all 0.2s; }
        .bg-blue { background: var(--p); }
        .bg-gold { background: var(--gold); color: #000; }

        .date-nav { display: flex; align-items: center; justify-content: center; gap: 20px; margin-bottom: 20px; background: var(--c); padding: 12px; border-radius: 50px; border: 1px solid #334155; }
        .date-nav button { background: #334155; border: none; color: #38bdf8; width: 40px; height: 40px; border-radius: 50%; font-size: 1.2rem; cursor: pointer; }

        .med-card { background: var(--c); padding: 15px; border-radius: 12px; margin-bottom: 10px; border-left: 8px solid #475569; display: flex; align-items: center; gap: 15px; transition: all 0.2s ease; cursor: pointer; }
        .med-card:hover { background: #2d3748; transform: translateX(5px); }

        .brd-matin { border-left-color: var(--gold); }
        .brd-midi { border-left-color: #38bdf8; }
        .brd-soir { border-left-color: #f97316; }
        .brd-coucher { border-left-color: #6366f1; }
        .brd-crise { border-left-color: var(--warn); }

        .chk { width: 30px; height: 30px; min-width: 30px; accent-color: var(--s); cursor: pointer; }
        .med-info { flex: 1; }
        .med-name { font-weight: 700; color: white; font-size: 1.1rem; }
        .med-meta { font-size: 0.85rem; color: #94a3b8; display: flex; align-items: center; gap: 5px; }
        
        .med-side { text-align: right; display: flex; flex-direction: column; align-items: flex-end; min-width: 95px; }
        .status-txt { font-weight: bold; font-size: 0.8rem; }
        .del-btn { color: var(--warn); background: none; border: none; font-size: 1.2rem; cursor: pointer; opacity: 0.4; }

        .admin-panel { display: none; background: var(--c); padding: 20px; border-radius: 12px; border: 2px solid var(--p); margin-bottom: 15px; }
        .input-group { margin-bottom: 15px; }
        label { font-size: 0.75rem; color: #94a3b8; font-weight: bold; display: block; margin-bottom: 8px; }
        input { width: 100%; padding: 14px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: white; font-size: 1rem; }

        .period-selector { display: flex; gap: 8px; margin-bottom: 15px; flex-wrap: wrap; }
        .p-btn { flex: 1; padding: 12px 5px; border-radius: 8px; border: 1px solid #334155; background: #1e293b; color: white; cursor: pointer; font-size: 0.7rem; }
        .act-Matin { background: var(--gold) !important; color: #000 !important; font-weight: bold; }
        .act-Midi { background: #38bdf8 !important; color: #000 !important; font-weight: bold; }
        .act-Soir { background: #f97316 !important; color: #fff !important; font-weight: bold; }
        .act-Coucher { background: #6366f1 !important; color: #fff !important; font-weight: bold; }
        .act-Crise { background: var(--warn) !important; color: #fff !important; font-weight: bold; }
    </style>
</head>
<body>

    <div class="app-header">
        <div class="app-title">Ma Pharmacie</div>
        <button class="btn-test" onclick="sendTestNotif()">TEST 📢</button>
    </div>

    <div class="action-bar">
        <button class="btn-top bg-blue" onclick="openForm()">➕ Ajouter</button>
        <button class="btn-top bg-gold" onclick="syncAllToCalendar()">📅 Agenda .ICS</button>
    </div>

    <div class="date-nav">
        <button onclick="changeDate(-1)">❮</button>
        <b id="dateDisplay">Aujourd'hui</b>
        <button onclick="changeDate(1)">❯</button>
    </div>

    <div id="adminPanel" class="admin-panel">
        <input type="hidden" id="editGroupId">
        <div class="input-group"><label>Nom du médicament</label><input type="text" id="name" placeholder="Doliprane..."></div>
        <div class="input-group">
            <label>Moments de prise</label>
            <div class="period-selector">
                <button class="p-btn" data-p="Matin" onclick="toggleP(this)">Matin</button>
                <button class="p-btn" data-p="Midi" onclick="toggleP(this)">Midi</button>
                <button class="p-btn" data-p="Soir" onclick="toggleP(this)">Soir</button>
                <button class="p-btn" data-p="Coucher" onclick="toggleP(this)">Couch.</button>
                <button class="p-btn" data-p="Crise" onclick="toggleP(this, true)">🚨 Crise</button>
            </div>
        </div>
        <div id="classicFields">
            <div class="input-group"><label>Date début</label><input type="date" id="startDay"></div>
            <div class="input-group"><label>Durée (jours)</label><input type="number" id="jours" value="30"></div>
        </div>
        <div class="input-group"><label>Intervalle minimum (heures)</label><input type="number" id="inter" value="4"></div>
        <button class="btn-top bg-blue" style="width:100%; height:50px" onclick="saveMed()">ENREGISTRER</button>
        <button class="btn-top" style="width:100%; margin-top:5px; background:#475569;" onclick="document.getElementById('adminPanel').style.display='none'">ANNULER</button>
    </div>

    <div id="list"></div>

<script>
    let curD = new Date(); curD.setHours(0,0,0,0);
    let meds = JSON.parse(localStorage.getItem('meds_v13') || "[]");
    let hist = JSON.parse(localStorage.getItem('hist_v13') || "{}");

    // FONCTION DE TEST
    function sendTestNotif() {
        if (!("Notification" in window)) return alert("Ce navigateur ne supporte pas les notifications.");
        Notification.requestPermission().then(permission => {
            if (permission === "granted") {
                new Notification("Test Réussi ! ✅", {
                    body: "Si vous voyez ce message, vos alertes fonctionneront.",
                    icon: "https://cdn-icons-png.flaticon.com/512/822/822143.png"
                });
            } else {
                alert("Les notifications sont bloquées dans les réglages de votre téléphone.");
            }
        });
    }

    function changeDate(n) { curD.setDate(curD.getDate() + n); render(); }

    function toggleP(btn, isCrise) {
        if(isCrise) {
            document.querySelectorAll('.p-btn').forEach(b => b.className = 'p-btn');
            btn.classList.add('act-Crise');
            document.getElementById('classicFields').style.display = 'none'; 
        } else {
            document.querySelector('[data-p="Crise"]').className = 'p-btn';
            btn.classList.toggle('act-' + btn.dataset.p);
            document.getElementById('classicFields').style.display = 'block';
        }
    }

    function openForm(gid = null) {
        document.getElementById('adminPanel').style.display = 'block';
        document.querySelectorAll('.p-btn').forEach(b => b.className = 'p-btn');
        if(gid) {
            const g = meds.filter(m => m.gid === gid);
            document.getElementById('editGroupId').value = gid;
            document.getElementById('name').value = g[0].n;
            document.getElementById('startDay').value = g[0].s;
            document.getElementById('jours').value = g[0].d;
            document.getElementById('inter').value = g[0].i || 4;
            g.forEach(m => { const b = document.querySelector(`[data-p="${m.p}"]`); if(b) b.classList.add('act-'+m.p); });
            document.getElementById('classicFields').style.display = g[0].p === 'Crise' ? 'none' : 'block';
        } else {
            document.getElementById('editGroupId').value = "";
            document.getElementById('name').value = "";
            document.getElementById('startDay').value = new Date().toISOString().split('T')[0];
            document.getElementById('inter').value = 4;
            document.getElementById('classicFields').style.display = 'block';
        }
    }

    function saveMed() {
        const name = document.getElementById('name').value;
        const selected = document.querySelectorAll('.p-btn[class*="act-"]');
        const editId = document.getElementById('editGroupId').value;
        if(!name || selected.length === 0) return alert("Nom et moment requis.");
        if(editId) meds = meds.filter(m => m.gid !== parseFloat(editId));
        const gid = editId ? parseFloat(editId) : Date.now();
        selected.forEach(btn => {
            const p = btn.dataset.p;
            meds.push({
                id: Date.now() + Math.random(), gid: gid, n: name, p: p,
                s: (p === 'Crise') ? "2000-01-01" : document.getElementById('startDay').value,
                d: (p === 'Crise') ? 999 : parseInt(document.getElementById('jours').value),
                i: parseInt(document.getElementById('inter').value) || 4,
                t: (p==='Matin'?'08:00':p==='Midi'?'12:00':p==='Soir'?'19:00':p==='Coucher'?'22:00':'Libre')
            });
        });
        localStorage.setItem('meds_v13', JSON.stringify(meds));
        document.getElementById('adminPanel').style.display = 'none';
        render();
    }

    function syncAllToCalendar() {
        let ics = "BEGIN:VCALENDAR\nVERSION:2.0\nPRODID:-//MaPharmacie//FR\n";
        meds.forEach(m => {
            if(m.p === 'Crise') return;
            let h = m.t.split(':')[0];
            ics += `BEGIN:VEVENT\nSUMMARY:💊 ${m.n} (${m.p})\nDTSTART:${new Date().toISOString().split('T')[0].replace(/-/g,'')}T${h}0000\nRRULE:FREQ=DAILY;COUNT=${m.d}\nEND:VEVENT\n`;
        });
        ics += "END:VCALENDAR";
        const blob = new Blob([ics], {type:'text/calendar'});
        const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `mes_alertes.ics`; a.click();
    }

    function render() {
        const k = curD.toISOString().split('T')[0];
        document.getElementById('dateDisplay').innerText = (k === new Date().toISOString().split('T')[0]) ? "Aujourd'hui" : curD.toLocaleDateString('fr-FR', {day:'numeric', month:'short'});
        const listDiv = document.getElementById('list');
        listDiv.innerHTML = "";
        meds.forEach(m => {
            const start = new Date(m.s); start.setHours(0,0,0,0);
            const diff = Math.round((curD - start) / 86400000);
            const rest = m.d - diff;
            if(m.p !== 'Crise' && (diff < 0 || rest <= 0)) return;
            const val = hist[k] && hist[k][m.id];
            const icon = m.p==='Matin'?'☀️':m.p==='Midi'?'🕛':m.p==='Soir'?'🌙':m.p==='Coucher'?'🛌':'🚨';
            const statusLabel = val ? (m.p==='Crise'?'Pris à '+val:'OK') : (m.p==='Crise'?'Interv: '+m.i+'h' : rest+' j. rest.');
            listDiv.innerHTML += `
                <div class="med-card brd-${m.p.toLowerCase()}" onclick="if(event.target.type !== 'checkbox' && event.target.tagName !== 'BUTTON') openForm(${m.gid})">
                    <input type="checkbox" class="chk" ${val?'checked':''} onchange="const d='${k}'; if(!hist[d])hist[d]={}; hist[d][${m.id}]=this.checked ? new Date().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}) : null; localStorage.setItem('hist_v13',JSON.stringify(hist)); render(); event.stopPropagation();">
                    <div class="med-info">
                        <div class="med-name">${m.n}</div>
                        <div class="med-meta">${icon} ${m.p} • ${m.t}</div>
                    </div>
                    <div class="med-side">
                        <div class="status-txt" style="color:${val?'#10b981':'#94a3b8'}">${statusLabel}</div>
                        <button class="del-btn" onclick="event.stopPropagation(); if(confirm('Supprimer ?')){meds=meds.filter(x=>x.id!=${m.id});localStorage.setItem('meds_v13',JSON.stringify(meds));render();}">🗑️</button>
                    </div>
                </div>`;
        });
    }
    render();
</script>
</body>
</html>
