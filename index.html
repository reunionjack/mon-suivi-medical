<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Suivi de mes ordonnances</title>
    
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">
    <meta name="apple-mobile-web-app-status-bar-style" content="#0f172a">
    <meta name="theme-color" content="#0284c7">

    <script>
        // Enregistrement du Service Worker corrigé
        (async function() {
            if ('serviceWorker' in navigator) {
                try {
                    const registration = await navigator.serviceWorker.register('/sw.js', { 
                        updateViaCache: 'none',
                        scope: '/'
                    });
                    console.log('✅ Service Worker enregistré:', registration.scope);
                    
                    // Vérifier les mises à jour
                    registration.addEventListener('updatefound', () => {
                        console.log('🔄 Nouvelle version du Service Worker détectée');
                    });
                } catch (error) {
                    console.error('❌ Erreur Service Worker:', error);
                }
            }
        })();
    </script>

    <style>
        :root { --p: #0284c7; --s: #10b981; --bg: #0f172a; --c: #1e293b; --txt: #f1f5f9; --warn: #f43f5e; --gold: #eab308; }
        * { box-sizing: border-box; font-family: system-ui, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: var(--txt); margin: 0; padding: 10px; padding-bottom: 50px; }
        
        /* --- HEADER : LOGO À GAUCHE, TITRE CENTRÉ --- */
        .app-header { 
            display: grid;
            grid-template-columns: 1fr auto 1fr; 
            align-items: center; 
            padding: 5px; 
            margin-bottom: 10px; 
            height: 70px;
            width: 100%;
        }
        
        .header-left { display: flex; justify-content: flex-start; }

        /* Logo responsive : plus grand sur PC */
        .header-logo { 
            height: 28px; 
            width: auto; 
            object-fit: contain; 
        }
        
        /* Sur écrans larges (PC), agrandir le logo */
        @media (min-width: 768px) {
            .header-logo {
                height: 48px; /* Plus grand sur PC */
            }
        }
        
        .header-center {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .app-title { 
            color: var(--p); 
            font-weight: 900; 
            font-size: 1.1rem;
            text-transform: uppercase; 
            margin: 0;
            line-height: 1.2;
            text-align: center;
        }
        
        .header-right { 
            display: flex; 
            gap: 8px; 
            align-items: center; 
            justify-content: flex-end;
        }
        
        .btn-reset { background: var(--warn); border: none; color: white; border-radius: 20px; padding: 0 10px; font-size: 0.65rem; font-weight: bold; height: 30px; display: flex; align-items: center; }
        .btn-notif { background: #475569; border: none; color: white; border-radius: 50%; width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; }
        .btn-notif.active { background: var(--s); }
        .action-bar { display: flex; gap: 8px; margin-bottom: 20px; }
        .btn-top { flex: 1; padding: 12px 5px; border-radius: 12px; border: none; font-weight: 700; font-size: 0.85rem; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; color: white; box-shadow: 0 4px 6px rgba(0,0,0,0.1); transition: all 0.2s; }
        .bg-blue { background: var(--p); } .bg-red { background: var(--warn); } .bg-gray { background: #475569; }
        .med-card { background: var(--c); padding: 15px; border-radius: 12px; margin-bottom: 10px; border-left: 8px solid #475569; display: flex; align-items: center; gap: 15px; }
        .med-card.completed { opacity: 0.4; filter: grayscale(1); }
        .brd-matin { border-left-color: var(--gold); } .brd-midi { border-left-color: #38bdf8; } .brd-soir { border-left-color: #f97316; } .brd-coucher { border-left-color: #6366f1; } .brd-crise { border-left-color: var(--warn); }
        .chk { width: 32px; height: 32px; min-width: 32px; accent-color: var(--s); }
        .med-info { flex: 1; }
        .med-name-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
        .med-name { font-weight: 700; color: white; font-size: 1.1rem; flex: 1; }
        .order-buttons { display: flex; gap: 4px; }
        .order-btn { background: #334155; border: none; color: #38bdf8; padding: 4px 8px; border-radius: 6px; font-size: 0.85rem; cursor: pointer; }
        .med-meta { font-size: 0.85rem; color: #94a3b8; }
        .date-nav { display: flex; align-items: center; justify-content: center; gap: 20px; margin-bottom: 20px; background: var(--c); padding: 12px; border-radius: 50px; }
        .date-nav button { background: #334155; border: none; color: #38bdf8; width: 40px; height: 40px; border-radius: 50%; font-size: 1.2rem; }
        .admin-panel { display: none; background: var(--c); padding: 20px; border-radius: 12px; border: 2px solid var(--p); margin-bottom: 15px; }
        input, select { width: 100%; padding: 14px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: white; margin-top: 5px; }
        .period-selector { display: flex; gap: 5px; margin-top: 10px; }
        .p-btn { flex: 1; padding: 10px 2px; border-radius: 8px; border: 1px solid #334155; background: #1e293b; color: white; font-size: 0.65rem; }
        .act-Matin { background: var(--gold) !important; color: #000 !important; font-weight: bold; }
        .act-Midi { background: #38bdf8 !important; color: #000 !important; font-weight: bold; }
        .act-Soir { background: #f97316 !important; color: #fff !important; font-weight: bold; }
        .act-Coucher { background: #6366f1 !important; color: #fff !important; font-weight: bold; }
        .act-Crise { background: var(--warn) !important; color: #fff !important; font-weight: bold; }
        .days-left { background: var(--p); color: white; padding: 2px 8px; border-radius: 12px; font-size: 0.75rem; font-weight: bold; margin-left: 8px; }
        
        /* Nouveau : champ d'heure personnalisée */
        .time-input-container { 
            margin-top: 15px; 
            padding: 15px; 
            background: #0f172a; 
            border-radius: 8px; 
            border: 2px solid #334155;
        }
        .time-period-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px;
            margin: 5px 0;
            background: #1e293b;
            border-radius: 6px;
        }
        .time-period-label {
            font-weight: 600;
            color: #94a3b8;
            min-width: 80px;
        }
        .time-period-input {
            padding: 8px;
            width: 120px;
            text-align: center;
        }
        
        /* Panneau de debug pour les notifications */
        .debug-panel {
            position: fixed;
            bottom: 10px;
            right: 10px;
            background: rgba(15, 23, 42, 0.95);
            border: 2px solid #0284c7;
            border-radius: 12px;
            padding: 15px;
            max-width: 300px;
            font-size: 0.75rem;
            color: #94a3b8;
            z-index: 1000;
            display: none;
        }
        .debug-panel.active {
            display: block;
        }
        .debug-title {
            color: #0284c7;
            font-weight: bold;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .debug-info {
            margin: 5px 0;
            padding: 5px;
            background: rgba(30, 41, 59, 0.5);
            border-radius: 4px;
        }
        .debug-close {
            background: #f43f5e;
            border: none;
            color: white;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            cursor: pointer;
            font-size: 0.7rem;
        }
    </style>
</head>
<body>

<!-- Panneau de debug -->
<div id="debugPanel" class="debug-panel">
    <div class="debug-title">
        🐛 Debug Notifications
        <button class="debug-close" onclick="document.getElementById('debugPanel').classList.remove('active')">✕</button>
    </div>
    <div id="debugContent"></div>
</div>

<div class="app-header">
    <div class="header-left">
        <img src="Logo3.png" alt="Logo" class="header-logo">
    </div>
    <div class="header-center">
        <h1 class="app-title">Suivi de mes<br>ordonnances</h1>
    </div>
    <div class="header-right">
        <button class="btn-notif" id="notifBtn" onclick="toggleNotifications()" title="Activer/Désactiver les notifications">🔕</button>
        <button class="btn-notif" onclick="testNotification()" title="Tester une notification" style="background:#6366f1;">🧪</button>
        <button class="btn-notif" onclick="toggleDebug()" title="Afficher le debug" style="background:#10b981;">🐛</button>
        <button class="btn-reset" onclick="if(confirm('Réinitialiser ?')){localStorage.clear(); location.reload();}">🔄 Reset</button>
    </div>
</div>

<div id="mainUI">
    <div class="date-nav">
        <button onclick="changeDate(-1)">◀</button>
        <span id="dateDisplay" style="font-weight:bold; font-size:1rem; color:white;">Aujourd'hui</span>
        <button onclick="changeDate(1)">▶</button>
    </div>
    <div class="action-bar">
        <button class="btn-top bg-blue" onclick="openForm()">➕ Nouveau</button>
        <button class="btn-top bg-gray" onclick="toggleConfig()">⚙️ Configurer</button>
        <button class="btn-top bg-red" onclick="showCrisePanel()">🚨 Crise</button>
    </div>
    <div id="list"></div>
</div>

<div id="adminPanel" class="admin-panel">
    <h3 style="margin-top:0; color:var(--p);">Gestion médicament</h3>
    <input type="hidden" id="editGroupId">
    <div><label style="color:#94a3b8;">Nom du médicament</label><input type="text" id="name"></div>
    <div><label style="color:#94a3b8;">Date de début</label><input type="date" id="startDay"></div>
    <div id="classicFields">
        <label style="color:#94a3b8;">Nombre de jours</label><input type="number" id="jours" value="30">
    </div>
    <div><label style="color:#94a3b8;">Moments de prise</label>
        <div class="period-selector">
            <button class="p-btn" data-p="Matin" onclick="toggleP(this, false)">☀️ Matin</button>
            <button class="p-btn" data-p="Midi" onclick="toggleP(this, false)">🕛 Midi</button>
            <button class="p-btn" data-p="Soir" onclick="toggleP(this, false)">🌙 Soir</button>
            <button class="p-btn" data-p="Coucher" onclick="toggleP(this, false)">🛌 Coucher</button>
            <button class="p-btn" data-p="Crise" onclick="toggleP(this, true)">🚨 Crise</button>
        </div>
    </div>
    
    <!-- NOUVEAU : Personnalisation des heures -->
    <div id="timeCustomization" class="time-input-container" style="display:none;">
        <label style="color:#94a3b8; font-weight:bold; margin-bottom:10px; display:block;">⏰ Heures de prise personnalisées</label>
        <div id="timeInputs"></div>
    </div>
    
    <div style="display:flex; gap:10px; margin-top:20px;">
        <button class="btn-top bg-blue" style="flex:1;" onclick="saveMed()">💾 Enregistrer</button>
        <button class="btn-top bg-gray" style="flex:1;" onclick="closePanels()">❌ Annuler</button>
    </div>
</div>

<div id="configPanel" class="admin-panel">
    <h3 style="margin-top:0; color:var(--p);">Configuration des médicaments</h3>
    <div id="configList"></div>
    <button class="btn-top bg-gray" style="width:100%; margin-top:15px;" onclick="closePanels()">← Retour</button>
</div>

<div id="crisePanel" class="admin-panel">
    <h3 style="margin-top:0; color:var(--p);">Enregistrer une prise en crise</h3>
    <div><label style="color:#94a3b8;">Date de la prise</label><input type="date" id="criseRetroDate"></div>
    <div id="criseChoices" style="margin-top:20px;"></div>
    <button class="btn-top bg-gray" style="width:100%; margin-top:15px;" onclick="closePanels()">← Retour</button>
</div>

<script>
    let meds = JSON.parse(localStorage.getItem('meds_v18')) || [];
    let hist = JSON.parse(localStorage.getItem('hist_v18')) || {};
    let curD = new Date();
    let notifsEnabled = localStorage.getItem('notifs_active') === 'true';
    let lastNotifiedMeds = JSON.parse(localStorage.getItem('last_notified')) || {};

    // ========== SYSTÈME DE NOTIFICATIONS AUTOMATIQUES (FONCTIONNE HORS LIGNE) ==========
    
    function toggleNotifications() {
        if (!("Notification" in window)) return alert("Notifications non supportées.");
        
        Notification.requestPermission().then(permission => {
            if (permission === "granted") {
                notifsEnabled = !notifsEnabled;
                localStorage.setItem('notifs_active', notifsEnabled);
                updateNotifBtn();
                
                if (notifsEnabled) {
                    startNotificationLoop();
                    // Envoyer une notification de test
                    sendNotification(
                        "✅ Notifications activées !",
                        "Vous recevrez des rappels aux heures programmées, même hors ligne."
                    );
                } else {
                    alert("🔕 Notifications désactivées.");
                }
            } else {
                alert("❌ Permission refusée. Activez les notifications dans les paramètres de votre navigateur.");
            }
        });
    }

    function updateNotifBtn() {
        const btn = document.getElementById('notifBtn');
        if(btn) {
            btn.classList.toggle('active', notifsEnabled);
            btn.innerHTML = notifsEnabled ? "🔔" : "🔕";
        }
    }

    let notificationInterval = null;

    function startNotificationLoop() {
        // Arrêter l'ancien intervalle s'il existe
        if (notificationInterval) {
            clearInterval(notificationInterval);
        }
        
        // Vérifier toutes les 15 secondes pour être plus réactif
        notificationInterval = setInterval(checkAndSendNotifications, 15000);
        
        // Vérifier immédiatement aussi
        checkAndSendNotifications();
        
        console.log('🔔 Boucle de notifications démarrée (vérification toutes les 15 secondes)');
    }

    function checkAndSendNotifications() {
        if (!notifsEnabled) {
            console.log('⏸️ Notifications désactivées, pas de vérification');
            return;
        }

        const now = new Date();
        const currentHour = now.getHours();
        const currentMinute = now.getMinutes();
        const today = now.toLocaleDateString('en-CA');
        const currentTimeStr = `${String(currentHour).padStart(2, '0')}:${String(currentMinute).padStart(2, '0')}`;

        console.log(`🕐 Vérification notifications : ${currentTimeStr}`);

        let foundMedications = 0;
        let sentNotifications = 0;

        // Pour chaque médicament avec une heure programmée
        meds.forEach(m => {
            if (m.p === 'Crise') return; // Pas de rappel auto pour les crises
            
            // Vérifier si le médicament est actif aujourd'hui
            const diff = Math.round((parseDateLocal(today) - parseDateLocal(m.s)) / 86400000);
            if (diff < 0 || (m.d - diff) <= 0) {
                return;
            }
            
            foundMedications++;
            
            // Vérifier si déjà pris aujourd'hui
            if (hist[today] && hist[today][m.id]) {
                console.log(`✅ ${m.n} déjà pris aujourd'hui`);
                return;
            }
            
            // Parser l'heure du médicament
            const medTimeParts = m.t.split(':');
            const medHour = parseInt(medTimeParts[0]);
            const medMinute = parseInt(medTimeParts[1]);
            
            // Calculer la différence en minutes
            const currentTotalMinutes = currentHour * 60 + currentMinute;
            const medTotalMinutes = medHour * 60 + medMinute;
            const timeDiff = currentTotalMinutes - medTotalMinutes;
            
            console.log(`   ${m.n} (${m.p}) prévu à ${m.t}, diff: ${timeDiff} minutes`);
            
            // Envoyer la notification si on est dans la fenêtre de 0 à +5 minutes
            if (timeDiff >= 0 && timeDiff <= 5) {
                const notifKey = `${today}-${m.id}-${medHour}-${medMinute}`;
                
                // Éviter d'envoyer plusieurs fois
                if (lastNotifiedMeds[notifKey]) {
                    console.log(`   ⏭️ Notification déjà envoyée pour ${m.n}`);
                    return;
                }
                
                lastNotifiedMeds[notifKey] = true;
                localStorage.setItem('last_notified', JSON.stringify(lastNotifiedMeds));
                
                const icon = m.p==='Matin'?'☀️':m.p==='Midi'?'🕛':m.p==='Soir'?'🌙':'🛌';
                console.log(`📣 🎯 ENVOI NOTIFICATION pour: ${m.n} à ${m.t}`);
                
                sendNotification(
                    `${icon} Rappel ${m.p} - ${m.t}`,
                    `Il est temps de prendre : ${m.n}`
                );
                
                sentNotifications++;
            }
        });

        console.log(`📊 Résumé: ${foundMedications} médicament(s) actif(s), ${sentNotifications} notification(s) envoyée(s)`);
    }

    async function sendNotification(title, body) {
        if (!("Notification" in window)) {
            console.error('❌ Notifications non supportées');
            return;
        }
        
        if (Notification.permission !== "granted") {
            console.error('❌ Permission notifications non accordée');
            return;
        }

        try {
            console.log('📤 Envoi notification:', title, body);
            
            // Vérifier si le Service Worker est prêt
            if ('serviceWorker' in navigator && navigator.serviceWorker.controller) {
                // Envoyer au Service Worker (fonctionne HORS LIGNE)
                navigator.serviceWorker.controller.postMessage({
                    type: 'SCHEDULE_NOTIF',
                    title: title,
                    body: body
                });
                console.log('✅ Notification envoyée via Service Worker');
            } else {
                // Fallback : notification directe
                new Notification(title, {
                    body: body,
                    icon: '/icon-192.png',
                    badge: '/icon-192.png',
                    vibrate: [200, 100, 200],
                    tag: 'medication-reminder',
                    requireInteraction: true
                });
                console.log('✅ Notification envoyée directement');
            }
        } catch (e) {
            console.error('❌ Erreur notification:', e);
        }
    }

    // Démarrer la boucle de notifications au chargement si activées
    window.addEventListener('load', () => {
        if (notifsEnabled && "Notification" in window && Notification.permission === "granted") {
            console.log('🚀 Démarrage automatique des notifications');
            startNotificationLoop();
        }
    });

    // Fonction de test pour les notifications
    function testNotification() {
        if (!("Notification" in window)) {
            return alert("❌ Les notifications ne sont pas supportées par votre navigateur.");
        }
        
        if (Notification.permission !== "granted") {
            return alert("❌ Veuillez d'abord activer les notifications en cliquant sur le bouton 🔔");
        }
        
        sendNotification(
            "🧪 Test de notification",
            "Si vous voyez ce message, les notifications fonctionnent parfaitement !"
        );
        
        console.log("✅ Notification de test envoyée");
    }

    // Fonction pour afficher/masquer le panneau de debug
    function toggleDebug() {
        const panel = document.getElementById('debugPanel');
        panel.classList.toggle('active');
        if (panel.classList.contains('active')) {
            updateDebugPanel();
            // Mettre à jour toutes les 5 secondes
            setInterval(updateDebugPanel, 5000);
        }
    }

    function updateDebugPanel() {
        const now = new Date();
        const currentTime = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
        const today = now.toLocaleDateString('en-CA');
        
        let html = `<div class="debug-info">⏰ Heure actuelle: <strong>${currentTime}</strong></div>`;
        html += `<div class="debug-info">🔔 Notifications: <strong>${notifsEnabled ? 'ON ✅' : 'OFF ❌'}</strong></div>`;
        html += `<div class="debug-info">📅 Date: ${today}</div>`;
        html += `<div class="debug-info" style="margin-top:10px; font-weight:bold; color:#0284c7;">Médicaments programmés aujourd'hui:</div>`;
        
        let count = 0;
        meds.forEach(m => {
            if (m.p === 'Crise') return;
            
            const diff = Math.round((parseDateLocal(today) - parseDateLocal(m.s)) / 86400000);
            if (diff < 0 || (m.d - diff) <= 0) return;
            
            const taken = hist[today] && hist[today][m.id];
            const icon = m.p==='Matin'?'☀️':m.p==='Midi'?'🕛':m.p==='Soir'?'🌙':'🛌';
            const status = taken ? '✅ Pris' : '⏳ En attente';
            
            html += `<div class="debug-info">
                ${icon} <strong>${m.n}</strong><br>
                Prévu: ${m.t} | ${status}
            </div>`;
            count++;
        });
        
        if (count === 0) {
            html += `<div class="debug-info" style="color:#94a3b8;">Aucun médicament programmé aujourd'hui</div>`;
        }
        
        document.getElementById('debugContent').innerHTML = html;
    }

    // ========== FIN SYSTÈME NOTIFICATIONS ==========

    function closePanels() { 
        document.querySelectorAll('.admin-panel').forEach(p => p.style.display='none'); 
        document.getElementById('mainUI').style.display='block'; 
        render(); 
    }
    
    function changeDate(n) { curD.setDate(curD.getDate() + n); render(); }
    
    function toggleP(btn, isCrise) {
        if(isCrise) { 
            document.querySelectorAll('.p-btn').forEach(b => b.classList.remove('act-Matin','act-Midi','act-Soir','act-Coucher','act-Crise')); 
            btn.classList.add('act-Crise'); 
            document.getElementById('classicFields').style.display = 'none'; 
            document.getElementById('timeCustomization').style.display = 'none';
        } else { 
            document.querySelector('[data-p="Crise"]').classList.remove('act-Crise'); 
            btn.classList.toggle('act-' + btn.dataset.p); 
            document.getElementById('classicFields').style.display = 'block';
            updateTimeInputs();
        }
    }
    
    // NOUVEAU : Afficher les champs d'heure personnalisés
    // Variable globale pour stocker les heures temporaires pendant l'édition
    let tempCustomTimes = {};
    
    function updateTimeInputs() {
        const selected = Array.from(document.querySelectorAll('.p-btn[class*="act-"]:not(.act-Crise)')).map(b => b.dataset.p);
        const container = document.getElementById('timeInputs');
        const customizationDiv = document.getElementById('timeCustomization');
        
        if (selected.length === 0) {
            customizationDiv.style.display = 'none';
            return;
        }
        
        // Sauvegarder les valeurs actuelles des champs avant de recréer le HTML
        selected.forEach(period => {
            const existingInput = document.getElementById(`time-${period}`);
            if (existingInput && existingInput.value) {
                tempCustomTimes[period] = existingInput.value;
            }
        });
        
        customizationDiv.style.display = 'block';
        container.innerHTML = '';
        
        const defaultTimes = {
            'Matin': '08:00',
            'Midi': '12:00',
            'Soir': '19:00',
            'Coucher': '22:00'
        };
        
        const icons = {
            'Matin': '☀️',
            'Midi': '🕛',
            'Soir': '🌙',
            'Coucher': '🛌'
        };
        
        selected.forEach(period => {
            // Ordre de priorité : 1) Valeur temporaire, 2) Médicament existant, 3) Valeur par défaut
            let currentTime;
            if (tempCustomTimes[period]) {
                currentTime = tempCustomTimes[period];
            } else {
                const existingMed = meds.find(m => m.p === period && m.gid === parseFloat(document.getElementById('editGroupId').value || 0));
                currentTime = existingMed ? existingMed.t : defaultTimes[period];
            }
            
            // Définir les limites d'heures pour chaque période
            let minTime, maxTime;
            switch(period) {
                case 'Matin':
                    minTime = '00:00';
                    maxTime = '11:59';
                    break;
                case 'Midi':
                    minTime = '12:00';
                    maxTime = '17:59';
                    break;
                case 'Soir':
                    minTime = '18:00';
                    maxTime = '23:59';
                    break;
                case 'Coucher':
                    minTime = '19:00';
                    maxTime = '23:59';
                    break;
            }
            
            container.innerHTML += `
                <div class="time-period-row">
                    <span class="time-period-label">${icons[period]} ${period}</span>
                    <input type="time" 
                           class="time-period-input" 
                           id="time-${period}" 
                           value="${currentTime}"
                           min="${minTime}"
                           max="${maxTime}"
                           onchange="tempCustomTimes['${period}'] = this.value;">
                </div>
            `;
        });
    }
    
    function toggleConfig() {
        document.getElementById('mainUI').style.display = 'none';
        const list = document.getElementById('configList'); list.innerHTML = "";
        const groups = {}; meds.forEach(m => { if(!groups[m.gid]) groups[m.gid] = m; });
        Object.values(groups).forEach(m => {
            list.innerHTML += `<div style="display:flex; justify-content:space-between; padding:12px; background:#1e293b; margin-bottom:8px; border-radius:10px; align-items:center; border-left:4px solid var(--p);"><span style="font-weight:bold; color:white;">${m.n}</span><div><button style="background:var(--p); color:white; border:none; padding:8px 12px; border-radius:8px; font-weight:bold; cursor:pointer;" onclick="openForm(${m.gid})">Modifier</button><button style="background:var(--warn); border:none; padding:8px; border-radius:8px; color:white; margin-left:5px; cursor:pointer;" onclick="deleteMed(${m.gid})">🗑️</button></div></div>`;
        });
        document.getElementById('configPanel').style.display = 'block';
    }

    function deleteMed(gid) { 
        if(confirm("Supprimer ce médicament ?")) { 
            meds = meds.filter(m => m.gid !== gid); 
            localStorage.setItem('meds_v18', JSON.stringify(meds)); 
            toggleConfig(); 
        } 
    }
    
    function openForm(gid = null) {
        document.getElementById('mainUI').style.display = 'none';
        document.querySelectorAll('.admin-panel').forEach(p => p.style.display='none');
        document.getElementById('adminPanel').style.display = 'block';
        
        // Réinitialiser les heures temporaires
        tempCustomTimes = {};
        
        if(gid) {
            const g = meds.filter(m => m.gid === gid);
            document.getElementById('editGroupId').value = gid; 
            document.getElementById('name').value = g[0].n; 
            document.getElementById('startDay').value = g[0].s; 
            document.getElementById('jours').value = g[0].d;
            
            g.forEach(m => { 
                const b = document.querySelector(`[data-p="${m.p}"]`); 
                if(b) b.classList.add('act-'+m.p); 
            });
            
            document.getElementById('classicFields').style.display = (g[0].p === 'Crise') ? 'none' : 'block';
            updateTimeInputs();
        } else {
            document.getElementById('editGroupId').value = ""; 
            document.getElementById('name').value = ""; 
            document.getElementById('startDay').value = curD.toLocaleDateString('en-CA'); 
            document.getElementById('classicFields').style.display = 'block';
            document.getElementById('timeCustomization').style.display = 'none';
            document.querySelectorAll('.p-btn').forEach(b => b.classList.remove('act-Matin','act-Midi','act-Soir','act-Coucher','act-Crise'));
        }
    }

    function saveMed() {
        const name = document.getElementById('name').value;
        const selected = Array.from(document.querySelectorAll('.p-btn[class*="act-"]')).map(b => b.dataset.p);
        if(!name || selected.length === 0) return alert("Nom et moment requis.");
        
        const gid = document.getElementById('editGroupId').value ? parseFloat(document.getElementById('editGroupId').value) : Date.now();
        let existing = meds.filter(m => m.gid === gid); 
        meds = meds.filter(m => m.gid !== gid);
        
        // Définir les plages horaires autorisées
        const timeRanges = {
            'Matin': { min: '00:00', max: '11:59' },
            'Midi': { min: '12:00', max: '17:59' },
            'Soir': { min: '18:00', max: '23:59' },
            'Coucher': { min: '19:00', max: '23:59' }
        };
        
        // Valider les heures avant d'enregistrer
        for (let p of selected) {
            if (p === 'Crise') continue;
            
            const timeInput = document.getElementById(`time-${p}`);
            if (timeInput && timeInput.value) {
                const inputTime = timeInput.value;
                const range = timeRanges[p];
                
                if (inputTime < range.min || inputTime > range.max) {
                    alert(`❌ ERREUR: L'heure ${inputTime} n'est pas valide pour "${p}".\n\n` +
                          `Heures autorisées pour ${p}: ${range.min} - ${range.max}`);
                    return; // Annuler l'enregistrement
                }
            }
        }
        
        selected.forEach(p => {
            const old = existing.find(ex => ex.p === p);
            
            // Récupérer l'heure personnalisée si elle existe
            let customTime = null;
            let customHour = null;
            if (p !== 'Crise') {
                const timeInput = document.getElementById(`time-${p}`);
                if (timeInput && timeInput.value) {
                    customTime = timeInput.value;
                    customHour = parseInt(timeInput.value.split(':')[0]);
                }
            }
            
            // Valeurs par défaut si pas d'heure personnalisée
            const defaultHours = {'Matin':8, 'Midi':12, 'Soir':19, 'Coucher':22};
            const defaultTimes = {'Matin':'08:00', 'Midi':'12:00', 'Soir':'19:00', 'Coucher':'22:00'};
            
            meds.push({ 
                id: old ? old.id : (Date.now() + Math.random()), 
                gid: gid, 
                n: name, 
                p: p, 
                s: document.getElementById('startDay').value, 
                d: (p === 'Crise') ? 9999 : parseInt(document.getElementById('jours').value), 
                h: customHour !== null ? customHour : (old ? old.h : defaultHours[p] || 23),
                t: customTime || (old ? old.t : defaultTimes[p] || 'Libre'),
                o: old ? old.o : Date.now() 
            });
        });
        
        localStorage.setItem('meds_v18', JSON.stringify(meds)); 
        closePanels();
    }

    function moveMed(id, dir) {
        const m = meds.find(x => x.id === id);
        if (!m) return;
        
        const sameCat = meds.filter(x => x.p === m.p).sort((a,b) => a.o - b.o);
        const idx = sameCat.findIndex(x => x.id === id);
        
        if (dir === -1 && idx > 0) {
            const temp = sameCat[idx].o;
            sameCat[idx].o = sameCat[idx-1].o;
            sameCat[idx-1].o = temp;
        } else if (dir === 1 && idx < sameCat.length - 1) {
            const temp = sameCat[idx].o;
            sameCat[idx].o = sameCat[idx+1].o;
            sameCat[idx+1].o = temp;
        }
        
        localStorage.setItem('meds_v18', JSON.stringify(meds));
        render();
    }

    function showCrisePanel() {
        document.getElementById('mainUI').style.display = 'none'; 
        document.querySelectorAll('.admin-panel').forEach(p => p.style.display='none');
        document.getElementById('criseRetroDate').value = curD.toLocaleDateString('en-CA');
        const container = document.getElementById('criseChoices'); container.innerHTML = "";
        meds.filter(m => m.p === 'Crise').forEach(m => {
            const btn = document.createElement('button'); 
            btn.className = "btn-top bg-blue"; 
            btn.style.width = "100%"; 
            btn.style.marginBottom = "10px"; 
            btn.innerText = "🚨 Prise : " + m.n;
            btn.onclick = () => { 
                const d = document.getElementById('criseRetroDate').value; 
                if(!hist[d]) hist[d] = {}; 
                hist[d][m.id] = new Date().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}); 
                localStorage.setItem('hist_v18', JSON.stringify(hist)); 
                closePanels(); 
            };
            container.appendChild(btn);
        });
        document.getElementById('crisePanel').style.display = 'block';
    }

    function parseDateLocal(s) { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); }

    function render() {
        const k = curD.toLocaleDateString('en-CA');
        document.getElementById('dateDisplay').innerText = (k === new Date().toLocaleDateString('en-CA')) ? "Aujourd'hui" : curD.toLocaleDateString('fr-FR', {day:'numeric', month:'short'});
        const listDiv = document.getElementById('list'); listDiv.innerHTML = "";
        meds.sort((a, b) => a.h - b.h || a.o - b.o);
        meds.forEach(m => {
            const val = hist[k] && hist[k][m.id]; 
            if (m.p === 'Crise' && !val) return;
            const diff = Math.round((parseDateLocal(k) - parseDateLocal(m.s)) / 86400000);
            if (m.p !== 'Crise' && (diff < 0 || (m.d - diff) <= 0)) return;
            if (m.p === 'Crise' && diff < 0) return;
            const rem = m.d - diff; 
            const icon = m.p==='Matin'?'☀️':m.p==='Midi'?'🕛':m.p==='Soir'?'🌙':m.p==='Coucher'?'🛌':'🚨';
            listDiv.innerHTML += `<div class="med-card brd-${m.p.toLowerCase()} ${val ? 'completed' : ''}" onclick="if(!['BUTTON','INPUT'].includes(event.target.tagName)) openForm(${m.gid})"><input type="checkbox" class="chk" ${val?'checked':''} onchange="const d='${k}'; if(!hist[d])hist[d]={}; hist[d][${m.id}]=this.checked ? new Date().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}) : null; localStorage.setItem('hist_v18',JSON.stringify(hist)); render(); event.stopPropagation();"><div class="med-info"><div class="med-name-row"><div class="med-name">${m.n}</div><div class="order-buttons"><button class="order-btn" onclick="event.stopPropagation(); moveMed(${m.id}, -1)">↑</button><button class="order-btn" onclick="event.stopPropagation(); moveMed(${m.id}, 1)">↓</button></div></div><div class="med-meta"><span>${icon} ${m.p} • ${val ? 'Pris à ' + val : 'Prévu à ' + m.t}</span>${m.p!=='Crise'?`<span class="days-left">J-${rem}</span>`:''}</div></div></div>`;
        });
        updateNotifBtn();
    }
    
    render();
</script>
</body>
</html>
