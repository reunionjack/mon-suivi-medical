<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0284c7">
    <style>
        :root { --p: #0284c7; --s: #10b981; --bg: #0f172a; --c: #1e293b; --txt: #f1f5f9; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: sans-serif; }
        body { background: var(--bg); color: var(--txt); margin: 0; padding: 10px; line-height: 1.4; }
        
        /* Ce bouton est le seul visible au départ */
        #showAddBtn { margin-bottom: 20px; }

        /* Le panneau est masqué par défaut */
        .admin-panel { 
            display: none; 
            background: var(--c); 
            padding: 15px; 
            border-radius: 12px; 
            border: 1px solid var(--p); 
            margin-bottom: 15px; 
        }

        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .full { grid-column: span 2; }
        label { font-size: 0.7rem; color: #94a3b8; font-weight: bold; display: block; margin-bottom: 4px; text-transform: uppercase; }
        input, select { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: white; font-size: 1rem; }
        
        .btn { width: 100%; padding: 15px; border-radius: 12px; border: none; font-weight: 900; cursor: pointer; text-transform: uppercase; }
        .blue { background: var(--p); color: white; }
        .green { background: var(--s); color: white; margin-top: 10px; }
        .cancel { background: #475569; color: white; margin-top: 5px; font-size: 0.8rem; padding: 10px; }

        .med-card { background: var(--c); padding: 15px; border-radius: 12px; border-left: 6px solid var(--p); margin-bottom: 10px; }
    </style>
</head>
<body>

    <button id="showAddBtn" class="btn blue" onclick="toggleForm()">+ AJOUTER UN MÉDICAMENT</button>

    <div id="adminPanel" class="admin-panel">
        <div class="grid">
            <div class="full"><label>Date de début du traitement</label><input type="date" id="startDay"></div>
            <div class="full"><label>Nom du médicament</label><input type="text" id="n" placeholder="Ex: Doliprane"></div>
            <div><label>Nombre de jours</label><input type="number" id="d" placeholder="Ex: 5"></div>
            <div><label>Heure de prise</label><input type="time" id="t"></div>
            <div class="full"><label>Intervalle min. (Optionnel)</label><input type="number" id="i" placeholder="Ex: 6"></div>
            
            <button class="btn green full" onclick="addMed()">AJOUTER LE MÉDICAMENT</button>
            <button class="btn cancel full" onclick="toggleForm()">ANNULER / FERMER</button>
        </div>
    </div>

    <div id="list"></div>

<script>
    // Enregistrement du Service Worker
    if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js'); }

    let meds = JSON.parse(localStorage.getItem('meds_v3') || "[]");

    // Fonction pour afficher ou masquer le formulaire
    function toggleForm() {
        const panel = document.getElementById('adminPanel');
        const btn = document.getElementById('showAddBtn');
        if (panel.style.display === 'block') {
            panel.style.display = 'none';
            btn.style.display = 'block';
        } else {
            panel.style.display = 'block';
            btn.style.display = 'none';
            document.getElementById('startDay').value = new Date().toISOString().split('T')[0];
        }
    }

    function addMed() {
        const name = document.getElementById('n').value;
        const time = document.getElementById('t').value;
        if(!name || !time) return alert("Remplissez au moins le nom et l'heure.");

        const med = {
            id: Date.now(),
            n: name,
            d: document.getElementById('d').value,
            t: time,
            i: document.getElementById('i').value || 4,
            start: document.getElementById('startDay').value
        };

        meds.push(med);
        localStorage.setItem('meds_v3', JSON.stringify(meds));
        toggleForm(); // Referme le panneau après l'ajout
        render();
    }

    function render() {
        const list = document.getElementById('list');
        list.innerHTML = "";
        meds.forEach(m => {
            list.innerHTML += `<div class="med-card"><strong>${m.n}</strong> - ${m.t}</div>`;
        });
    }
    render();
</script>
</body>
</html>
