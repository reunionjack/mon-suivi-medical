<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Suivi Ordo V2</title>
    
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">
    <meta name="theme-color" content="#0284c7">

    <style>
        :root { --p: #0284c7; --bg: #0f172a; --c: #1e293b; --txt: #f1f5f9; --warn: #f43f5e; }
        * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; user-select: none; }
        body { background: var(--bg); color: var(--txt); margin: 0; padding: 10px; padding-bottom: 80px; }
        
        /* HEADER & UI */
        .app-header { display: flex; justify-content: space-between; align-items: center; height: 60px; margin-bottom: 10px; }
        .app-title { color: var(--p); font-weight: 900; font-size: 1.2rem; text-transform: uppercase; }
        .btn-action { padding: 8px 12px; border-radius: 8px; border: none; font-weight: bold; color: white; cursor: pointer; }
        .bg-blue { background: var(--p); } .bg-red { background: var(--warn); } .bg-gray { background: #475569; }
        
        .action-bar { display: flex; gap: 10px; margin-bottom: 20px; }
        .btn-big { flex: 1; padding: 15px; border-radius: 12px; border: none; font-size: 1rem; font-weight: bold; color: white; box-shadow: 0 4px 6px rgba(0,0,0,0.2); }

        /* CARTE MÉDICAMENT */
        .med-card { 
            background: var(--c); 
            padding: 10px; 
            border-radius: 12px; 
            margin-bottom: 15px; 
            border-left: 6px solid #475569; 
            display: flex; 
            align-items: center; 
            gap: 10px; 
        }
        .med-card.completed { opacity: 0.5; filter: grayscale(1); }
        
        /* Checkbox custom */
        .chk-container { position: relative; width: 40px; height: 40px; }
        .chk { width: 100%; height: 100%; opacity: 0; position: absolute; z-index: 2; cursor: pointer; }
        .chk-visual { width: 100%; height: 100%; background: #334155; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; }
        .chk:checked + .chk-visual { background: #10b981; }
        .chk:checked + .chk-visual::after { content: '✓'; color: white; }

        /* Infos & Boutons */
        .med-info { flex: 1; display: flex; flex-direction: column; justify-content: center; }
        .med-name { font-size: 1.1rem; font-weight: bold; color: white; margin-bottom: 4px; }
        .med-meta { font-size: 0.85rem; color: #94a3b8; }
        
        /* STYLES SPÉCIFIQUES FLÈCHES */
        .arrow-col { display: flex; flex-direction: column; gap: 4px; }
        .arrow-btn {
            width: 48px;  /* LARGEUR FORCÉE */
            height: 40px; /* HAUTEUR FORCÉE */
            background: #334155;
            border: 1px solid #475569;
            border-radius: 8px;
            color: #38bdf8;
            font-size: 22px; /* TEXTE GROS */
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            touch-action: manipulation;
        }
        .arrow-btn:active { background: #0ea5e9; color: white; }

        /* NAVIGATION DATE */
        .date-nav { display: flex; align-items: center; justify-content: space-between; background: var(--c); padding: 10px 20px; border-radius: 50px; margin-bottom: 20px; }
        .nav-btn { background: none; border: none; color: #38bdf8; font-size: 1.5rem; padding: 5px 15px; }

        /* PANEL EDIT */
        .panel { position: fixed; top: 0; left: 0; w-100%; height: 100%; background: rgba(15,23,42,0.95); z-index: 100; padding: 20px; overflow-y: auto; display: none; }
        .panel-content { background: #1e293b; padding: 20px; border-radius: 16px; border: 1px solid var(--p); max-width: 500px; margin: 40px auto; }
        input, select { width: 100%; padding: 12px; margin: 8px 0; background: #0f172a; border: 1px solid #334155; color: white; border-radius: 8px; }
        
        .period-select { display: flex; gap: 5px; margin: 10px 0; overflow-x: auto; }
        .p-chip { padding: 8px 12px; background: #0f172a; border: 1px solid #334155; border-radius: 20px; color: #94a3b8; white-space: nowrap; }
        .p-chip.active { background: var(--p); color: white; border-color: var(--p); }

        /* Couleurs Bordures */
        .b-Matin { border-left-color: #eab308; } 
        .b-Midi { border-left-color: #38bdf8; }
        .b-Soir { border-left-color: #f97316; }
        .b-Coucher { border-left-color: #6366f1; }
        .b-Crise { border-left-color: #f43f5e; }
    </style>
</head>
<body>

<div class="app-header">
    <img src="Logo3.png" style="height:40px;">
    <div class="app-title">Ordonnances</div>
    <button class="btn-action bg-gray" onclick="toggleNotif()">🔔</button>
</div>

<div class="action-bar">
    <button class="btn-big bg-blue" onclick="openEdit()">➕ Ajouter</button>
    <button class="btn-big bg-red" onclick="openCrise()">🚨 Crise</button>
</div>

<div class="date-nav">
    <button class="nav-btn" onclick="addDay(-1)">◀</button>
    <span id="dateDisplay" style="font-weight:bold;">Aujourd'hui</span>
    <button class="nav-btn" onclick="addDay(1)">▶</button>
</div>

<div id="list"></div>

<div id="editPanel" class="panel">
    <div class="panel-content">
        <h2 style="margin-top:0; color:var(--p)">Médicament</h2>
        <input type="hidden" id="editGid">
        
        <label>Nom</label>
        <input type="text" id="inpName" placeholder="Ex: Doliprane">
        
        <label>Début & Durée</label>
        <div style="display:flex; gap:10px;">
            <input type="date" id="inpStart">
            <input type="number" id="inpDays" value="7" style="width:80px">
        </div>

        <label>Moment de prise</label>
        <div class="period-select" id="periodContainer">
            </div>

        <div id="timeContainer"></div>

        <div style="margin-top:20px; display:flex; gap:10px;">
            <button class="btn-big bg-blue" onclick="saveMed()">Enregistrer</button>
            <button class="btn-big bg-red" onclick="deleteMed()">Supprimer</button>
        </div>
        <button class="btn-action bg-gray" style="width:100%; margin-top:10px;" onclick="closePanel()">Annuler</button>
    </div>
</div>

<script>
    // --- GESTION DES DONNÉES ---
    let meds = JSON.parse(localStorage.getItem('meds_v18')) || [];
    let hist = JSON.parse(localStorage.getItem('hist_v18')) || {};
    let curDate = new Date();
    
    // NETTOYAGE AU DÉMARRAGE (RÉPARATION DU TRI)
    function sanitizeOrder() {
        // On s'assure que chaque groupe a des index propres (0, 1, 2...)
        const periods = ['Matin', 'Midi', 'Soir', 'Coucher', 'Crise'];
        periods.forEach(p => {
            // On prend les meds de ce groupe, on les trie par leur ordre actuel
            let group = meds.filter(m => m.p === p).sort((a, b) => (a.o || 0) - (b.o || 0));
            // On réattribue des numéros propres 0, 1, 2...
            group.forEach((m, idx) => {
                // On met à jour l'objet original dans le tableau meds
                const original = meds.find(x => x.id === m.id);
                if(original) original.o = idx;
            });
        });
        localStorage.setItem('meds_v18', JSON.stringify(meds));
    }
    sanitizeOrder(); // Lancer immédiatement

    // --- RENDU (DISPLAY) ---
    function render() {
        const dStr = curDate.toLocaleDateString('en-CA');
        const isToday = dStr === new Date().toLocaleDateString('en-CA');
        document.getElementById('dateDisplay').innerText = isToday ? "Aujourd'hui" : curDate.toLocaleDateString('fr-FR', {day:'numeric', month:'short'});

        const list = document.getElementById('list');
        list.innerHTML = "";

        // Ordre d'affichage des groupes
        const pOrder = { 'Matin':1, 'Midi':2, 'Soir':3, 'Coucher':4, 'Crise':5 };
        
        // TRI PRINCIPAL : Par Période -> Puis par Ordre (.o)
        meds.sort((a, b) => {
            const pa = pOrder[a.p] || 99;
            const pb = pOrder[b.p] || 99;
            if (pa !== pb) return pa - pb;
            return (a.o || 0) - (b.o || 0); // Utilise 0 si .o n'existe pas
        });

        meds.forEach(m => {
            // Logique de date
            const start = new Date(m.s);
            const current = new Date(dStr);
            const diffDays = Math.round((current - start) / (1000 * 60 * 60 * 24));
            
            // Filtres d'affichage
            if (m.p !== 'Crise') {
                if (diffDays < 0 || diffDays >= m.d) return; // Pas encore commencé ou fini
            } else {
                // Pour crise : afficher si pris ce jour-là OU si c'est aujourd'hui (pour pouvoir le prendre)
                if (!hist[dStr]?.[m.id] && !isToday) return; 
            }

            const isTaken = hist[dStr] && hist[dStr][m.id];
            
            // Création HTML
            const div = document.createElement('div');
            div.className = `med-card b-${m.p} ${isTaken ? 'completed' : ''}`;
            div.innerHTML = `
                <div class="chk-container">
                    <input type="checkbox" class="chk" ${isTaken?'checked':''} onchange="toggleCheck('${m.id}', this.checked)">
                    <div class="chk-visual"></div>
                </div>
                <div class="med-info" onclick="openEdit(${m.gid})">
                    <div class="med-name">${m.n}</div>
                    <div class="med-meta">${m.p} • ${isTaken ? isTaken : m.t} ${m.p!=='Crise' ? '• J-'+(m.d - diffDays) : ''}</div>
                </div>
                <div class="arrow-col">
                    <button class="arrow-btn" onclick="move('${m.id}', -1)">▲</button>
                    <button class="arrow-btn" onclick="move('${m.id}', 1)">▼</button>
                </div>
            `;
            list.appendChild(div);
        });
    }

    // --- ACTIONS ---
    function move(id, dir) {
        // 1. Trouver le médicament concerné
        const target = meds.find(m => m.id == id);
        if (!target) return;

        // 2. Trouver ses voisins du même groupe (ex: Matin)
        // On filtre et on trie pour être sûr d'avoir l'ordre visuel actuel
        const group = meds.filter(m => m.p === target.p).sort((a, b) => a.o - b.o);
        
        // 3. Trouver sa position dans ce groupe
        const idx = group.findIndex(m => m.id == id);
        
        // 4. Vérifier si déplacement possible
        if (dir === -1 && idx > 0) {
            // Echange avec le précédent
            const neighbor = group[idx - 1];
            const temp = target.o;
            target.o = neighbor.o;
            neighbor.o = temp;
        } else if (dir === 1 && idx < group.length - 1) {
            // Echange avec le suivant
            const neighbor = group[idx + 1];
            const temp = target.o;
            target.o = neighbor.o;
            neighbor.o = temp;
        } else {
            return; // Pas de mouvement possible
        }

        // 5. Sauvegarder et redessiner
        // On re-sanitize pour être sûr que tout est propre (0,1,2...)
        meds.sort((a,b) => a.o - b.o); // petit tri préventif
        sanitizeOrder(); 
        render();
    }

    function toggleCheck(id, checked) {
        const dStr = curDate.toLocaleDateString('en-CA');
        if (!hist[dStr]) hist[dStr] = {};
        
        if (checked) {
            hist[dStr][id] = new Date().toLocaleTimeString('fr-FR', {hour:'2-digit', minute:'2-digit'});
        } else {
            delete hist[dStr][id];
        }
        localStorage.setItem('hist_v18', JSON.stringify(hist));
        render();
    }

    function addDay(n) {
        curDate.setDate(curDate.getDate() + n);
        render();
    }

    // --- ÉDITION ---
    let selectedPeriods = [];
    const PERIODS = ['Matin', 'Midi', 'Soir', 'Coucher', 'Crise'];

    function openEdit(gid = null) {
        document.getElementById('editPanel').style.display = 'block';
        const pCont = document.getElementById('periodContainer');
        pCont.innerHTML = '';
        selectedPeriods = [];
        
        // Générer boutons périodes
        PERIODS.forEach(p => {
            const btn = document.createElement('div');
            btn.className = 'p-chip';
            btn.innerText = p;
            btn.id = `chip-${p}`;
            btn.onclick = () => togglePeriod(p);
            pCont.appendChild(btn);
        });

        if (gid) {
            // Mode Modification
            const group = meds.filter(m => m.gid == gid);
            if(group.length) {
                const first = group[0];
                document.getElementById('editGid').value = gid;
                document.getElementById('inpName').value = first.n;
                document.getElementById('inpStart').value = first.s;
                document.getElementById('inpDays').value = first.d;
                group.forEach(m => togglePeriod(m.p, m.t));
            }
        } else {
            // Mode Ajout
            document.getElementById('editGid').value = '';
            document.getElementById('inpName').value = '';
            document.getElementById('inpStart').value = new Date().toLocaleDateString('en-CA');
            document.getElementById('inpDays').value = 7;
        }
    }

    function togglePeriod(p, timeVal = null) {
        const idx = selectedPeriods.findIndex(x => x.p === p);
        const chip = document.getElementById(`chip-${p}`);
        
        if (idx > -1 && timeVal === null) {
            // Deselect si on clique sans fournir de temps (clic utilisateur)
            selectedPeriods.splice(idx, 1);
            chip.classList.remove('active');
        } else {
            // Select
            if(idx === -1) selectedPeriods.push({ p: p, t: timeVal });
            chip.classList.add('active');
        }
        renderTimeInputs();
    }

    function renderTimeInputs() {
        const c = document.getElementById('timeContainer');
        c.innerHTML = '';
        selectedPeriods.forEach(item => {
            if (item.p === 'Crise') return;
            const row = document.createElement('div');
            row.style.margin = "10px 0";
            // Heures par défaut
            let def = "08:00";
            if(item.p === "Midi") def = "12:00";
            if(item.p === "Soir") def = "19:00";
            if(item.p === "Coucher") def = "22:00";
            
            const val = item.t || def;
            
            row.innerHTML = `<span style="color:#94a3b8; margin-right:10px;">Heure ${item.p}:</span>
                             <input type="time" id="time-${item.p}" value="${val}" style="width:100px;">`;
            c.appendChild(row);
        });
    }

    function saveMed() {
        const name = document.getElementById('inpName').value;
        const start = document.getElementById('inpStart').value;
        const days = document.getElementById('inpDays').value;
        const gid = document.getElementById('editGid').value || Date.now();
        
        if(!name || selectedPeriods.length === 0) return alert("Nom et période requis");

        // Supprimer anciens du même groupe
        meds = meds.filter(m => m.gid != gid);

        // Ajouter nouveaux
        selectedPeriods.forEach(sp => {
            let time = "Libre";
            if(sp.p !== 'Crise') {
                const inp = document.getElementById(`time-${sp.p}`);
                if(inp) time = inp.value;
            }
            
            // Calculer ordre: mettre à la fin du groupe existant
            const existingGroup = meds.filter(m => m.p === sp.p);
            const maxOrder = existingGroup.length > 0 ? Math.max(...existingGroup.map(m => m.o || 0)) : -1;

            meds.push({
                id: Date.now() + Math.random(),
                gid: gid,
                n: name,
                p: sp.p,
                s: start,
                d: parseInt(days),
                t: time,
                o: maxOrder + 1 // Ajoute à la fin
            });
        });

        sanitizeOrder(); // Nettoyer
        closePanel();
        render();
    }

    function deleteMed() {
        const gid = document.getElementById('editGid').value;
        if(gid && confirm("Supprimer ?")) {
            meds = meds.filter(m => m.gid != gid);
            sanitizeOrder();
            closePanel();
            render();
        }
    }

    function closePanel() {
        document.getElementById('editPanel').style.display = 'none';
    }

    function openCrise() {
        // Redirige vers un ajout rapide crise via le panel edit
        openEdit();
        // Auto-select Crise (simplification UX)
        setTimeout(() => togglePeriod('Crise'), 100);
    }
    
    // Notifications (placeholder pour compatibilité)
    function toggleNotif() {
        if('Notification' in window) Notification.requestPermission();
    }

    // Init
    render();

    // Service Worker
    if('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js');
</script>
</body>
</html>
