<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Suivi de mes ordonnances</title>
    
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">
    <meta name="apple-mobile-web-app-status-bar-style" content="#0f172a">
    <meta name="theme-color" content="#0284c7">

    <script>
        // Enregistrement du Service Worker corrigé
        (async function() {
            if ('serviceWorker' in navigator) {
                try {
                    const registration = await navigator.serviceWorker.register('/sw.js', { 
                        updateViaCache: 'none',
                        scope: '/'
                    });
                    console.log('✅ Service Worker enregistré:', registration.scope);
                    
                    // Vérifier les mises à jour
                    registration.addEventListener('updatefound', () => {
                        console.log('🔄 Nouvelle version du Service Worker détectée');
                    });
                } catch (error) {
                    console.error('❌ Erreur Service Worker:', error);
                }
            }
        })();
    </script>

    <style>
        :root { --p: #0284c7; --s: #10b981; --bg: #0f172a; --c: #1e293b; --txt: #f1f5f9; --warn: #f43f5e; --gold: #eab308; }
        * { box-sizing: border-box; font-family: system-ui, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: var(--txt); margin: 0; padding: 10px; padding-bottom: 50px; }
        
        /* --- HEADER : LOGO À GAUCHE, TITRE CENTRÉ --- */
        .app-header { 
            display: grid;
            grid-template-columns: 1fr auto 1fr; 
            align-items: center; 
            padding: 5px; 
            margin-bottom: 10px; 
            height: 70px;
            width: 100%;
        }
        
        .header-left { display: flex; justify-content: flex-start; }

        /* Logo responsive : plus grand sur PC */
        .header-logo { 
            height: 28px; 
            width: auto; 
            object-fit: contain; 
        }
        
        /* Sur écrans larges (PC), agrandir le logo */
        @media (min-width: 768px) {
            .header-logo {
                height: 48px; /* Plus grand sur PC */
            }
        }
        
        .header-center {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .app-title { 
            color: var(--p); 
            font-weight: 900; 
            font-size: 1.1rem;
            text-transform: uppercase; 
            margin: 0;
            line-height: 1.2;
            text-align: center;
        }
        
        .header-right { 
            display: flex; 
            gap: 8px; 
            align-items: center; 
            justify-content: flex-end;
        }
        
        .btn-reset { background: var(--warn); border: none; color: white; border-radius: 20px; padding: 0 10px; font-size: 0.65rem; font-weight: bold; height: 30px; display: flex; align-items: center; }
        .btn-notif { background: #475569; border: none; color: white; border-radius: 50%; width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; }
        .btn-notif.active { background: var(--s); }
        .action-bar { display: flex; gap: 8px; margin-bottom: 20px; }
        .btn-top { flex: 1; padding: 12px 5px; border-radius: 12px; border: none; font-weight: 700; font-size: 0.85rem; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; color: white; box-shadow: 0 4px 6px rgba(0,0,0,0.1); transition: all 0.2s; }
        .bg-blue { background: var(--p); } .bg-red { background: var(--warn); } .bg-gray { background: #475569; }
        .med-card { background: var(--c); padding: 15px; border-radius: 12px; margin-bottom: 10px; border-left: 8px solid #475569; display: flex; align-items: center; gap: 15px; }
        .med-card.completed { opacity: 0.4; filter: grayscale(1); }
        .brd-matin { border-left-color: var(--gold); } .brd-midi { border-left-color: #38bdf8; } .brd-soir { border-left-color: #f97316; } .brd-coucher { border-left-color: #6366f1; } .brd-crise { border-left-color: var(--warn); }
        .chk { width: 32px; height: 32px; min-width: 32px; accent-color: var(--s); }
        .med-info { flex: 1; }
        .med-name-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
        .med-name { font-weight: 700; color: white; font-size: 1.1rem; flex: 1; }
        .order-buttons { display: flex; gap: 4px; }
        .order-btn { background: #334155; border: none; color: #38bdf8; padding: 8px 12px; border-radius: 6px; font-size: 1.1rem; cursor: pointer; font-weight: bold; min-width: 36px; min-height: 36px; display: flex; align-items: center; justify-content: center; }
        .med-meta { font-size: 0.85rem; color: #94a3b8; }
        .date-nav { display: flex; align-items: center; justify-content: center; gap: 20px; margin-bottom: 20px; background: var(--c); padding: 12px; border-radius: 50px; }
        .date-nav button { background: #334155; border: none; color: #38bdf8; width: 40px; height: 40px; border-radius: 50%; font-size: 1.2rem; }
        .admin-panel { display: none; background: var(--c); padding: 20px; border-radius: 12px; border: 2px solid var(--p); margin-bottom: 15px; }
        input, select { width: 100%; padding: 14px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: white; margin-top: 5px; }
        .period-selector { display: flex; gap: 5px; margin-top: 10px; }
        .p-btn { flex: 1; padding: 10px 2px; border-radius: 8px; border: 1px solid #334155; background: #1e293b; color: white; font-size: 0.65rem; }
        .act-Matin { background: var(--gold) !important; color: #000 !important; font-weight: bold; }
        .act-Midi { background: #38bdf8 !important; color: #000 !important; font-weight: bold; }
        .act-Soir { background: #f97316 !important; color: #fff !important; font-weight: bold; }
        .act-Coucher { background: #6366f1 !important; color: #fff !important; font-weight: bold; }
        .act-Crise { background: var(--warn) !important; color: #fff !important; font-weight: bold; }
        .days-left { background: var(--p); color: white; padding: 2px 8px; border-radius: 12px; font-size: 0.75rem; font-weight: bold; margin-left: 8px; }
        
        /* Nouveau : champ d'heure personnalisée */
        .time-input-container { 
            margin-top: 15px; 
            padding: 15px; 
            background: #0f172a; 
            border-radius: 8px; 
            border: 2px solid #334155;
        }
        .time-period-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px;
            margin: 5px 0;
            background: #1e293b;
            border-radius: 6px;
        }
        .time-period-label {
            font-weight: 600;
            color: #94a3b8;
            min-width: 80px;
        }
        .time-period-input {
            padding: 8px;
            width: 120px;
            text-align: center;
        }
        
        /* Panneau de debug pour les notifications */
        .debug-panel {
            position: fixed;
            bottom: 10px;
            right: 10px;
            background: rgba(15, 23, 42, 0.95);
            border: 2px solid #0284c7;
            border-radius: 12px;
            padding: 15px;
            max-width: 300px;
            font-size: 0.75rem;
            color: #94a3b8;
            z-index: 1000;
            display: none;
        }
        .debug-panel.active {
            display: block;
        }
        .debug-title {
            color: #0284c7;
            font-weight: bold;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .debug-info {
            margin: 5px 0;
            padding: 5px;
            background: rgba(30, 41, 59, 0.5);
            border-radius: 4px;
        }
        .debug-close-btn {
            background: #f43f5e;
            border: none;
            color: white;
            padding: 2px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.7rem;
        }
    </style>
</head>
<body>

<div id="mainUI">
    <!-- En-tête avec logo -->
    <div class="app-header">
        <div class="header-left">
            <img src="Logo3.png" alt="Logo" class="header-logo">
        </div>
        <div class="header-center">
            <h1 class="app-title">Ordonnances</h1>
        </div>
        <div class="header-right">
            <button class="btn-notif" id="notifBtn" onclick="toggleNotif()" title="Activer/Désactiver les notifications">🔔</button>
            <button class="btn-reset" onclick="if(confirm('❌ Supprimer TOUTES les données ?')){localStorage.clear(); location.reload();}">⚠️ Reset</button>
        </div>
    </div>

    <!-- Barre d'action -->
    <div class="action-bar">
        <button class="btn-top bg-blue" onclick="openForm()">➕ Ajouter</button>
        <button class="btn-top bg-red" onclick="showCrisePanel()">🚨 Crise</button>
        <button class="btn-top bg-gray" onclick="exportData()">📤 Export</button>
    </div>

    <!-- Navigation Date -->
    <div class="date-nav">
        <button onclick="curD.setDate(curD.getDate()-1); render();">◀</button>
        <span id="dateDisplay">Aujourd'hui</span>
        <button onclick="curD.setDate(curD.getDate()+1); render();">▶</button>
    </div>

    <!-- Liste des médicaments -->
    <div id="list"></div>
</div>

<!-- Panneau Admin -->
<div class="admin-panel" id="medPanel">
    <h3 style="margin-top:0; color: var(--p);">💊 Médicament</h3>
    <input type="hidden" id="editGroupId">
    <label>Nom du médicament</label>
    <input id="medName" type="text" placeholder="Ex: Doliprane 1000mg">
    
    <label style="margin-top: 15px;">Date de début</label>
    <input id="startDay" type="date">
    
    <label style="margin-top: 15px;">Durée du traitement (jours)</label>
    <input id="jours" type="number" value="7" min="1">

    <label style="margin-top: 15px;">📅 Périodes de prise</label>
    <div class="period-selector">
        <button class="p-btn" id="btn-Matin" onclick="togglePeriod('Matin')">☀️ Matin</button>
        <button class="p-btn" id="btn-Midi" onclick="togglePeriod('Midi')">🕛 Midi</button>
        <button class="p-btn" id="btn-Soir" onclick="togglePeriod('Soir')">🌙 Soir</button>
        <button class="p-btn" id="btn-Coucher" onclick="togglePeriod('Coucher')">🛌 Coucher</button>
        <button class="p-btn" id="btn-Crise" onclick="togglePeriod('Crise')">🚨 Crise</button>
    </div>
    
    <!-- Heures personnalisées -->
    <div class="time-input-container" id="timeInputs">
        <label style="font-weight: bold; color: var(--p); margin-bottom: 10px; display: block;">⏰ Heures de prise</label>
        
        <div class="time-period-row" id="time-row-Matin" style="display: none;">
            <span class="time-period-label">☀️ Matin :</span>
            <input type="time" id="time-Matin" class="time-period-input" value="08:00" min="00:00" max="11:59">
        </div>
        
        <div class="time-period-row" id="time-row-Midi" style="display: none;">
            <span class="time-period-label">🕛 Midi :</span>
            <input type="time" id="time-Midi" class="time-period-input" value="12:00" min="12:00" max="17:59">
        </div>
        
        <div class="time-period-row" id="time-row-Soir" style="display: none;">
            <span class="time-period-label">🌙 Soir :</span>
            <input type="time" id="time-Soir" class="time-period-input" value="19:00" min="18:00" max="23:59">
        </div>
        
        <div class="time-period-row" id="time-row-Coucher" style="display: none;">
            <span class="time-period-label">🛌 Coucher :</span>
            <input type="time" id="time-Coucher" class="time-period-input" value="22:00" min="19:00" max="23:59">
        </div>
    </div>

    <div style="margin-top: 20px; display: flex; gap: 10px;">
        <button class="btn-top bg-blue" onclick="saveMed()">💾 Enregistrer</button>
        <button class="btn-top bg-gray" onclick="closePanels()">❌ Annuler</button>
    </div>
</div>

<!-- Panneau Crise -->
<div class="admin-panel" id="crisePanel">
    <h3 style="margin-top:0; color: var(--warn);">🚨 Prise en crise</h3>
    <label>Date de la prise</label>
    <input id="criseRetroDate" type="date">
    <div id="criseChoices" style="margin-top: 20px;"></div>
    <button class="btn-top bg-gray" onclick="closePanels()" style="margin-top: 15px; width: 100%; padding: 15px; font-size: 1rem;">❌ Annuler</button>
</div>

<!-- Panneau de debug notifications -->
<div class="debug-panel" id="debugPanel">
    <div class="debug-title">
        🔔 Debug Notifications
        <button class="debug-close-btn" onclick="document.getElementById('debugPanel').classList.remove('active')">×</button>
    </div>
    <div id="debugContent"></div>
</div>

<script>
    let meds = JSON.parse(localStorage.getItem('meds_v18')) || [];
    let hist = JSON.parse(localStorage.getItem('hist_v18')) || {};
    let curD = new Date();
    let selectedPeriods = [];
    let notifEnabled = localStorage.getItem('notifEnabled') === 'true';

    function toggleNotif() {
        if (!notifEnabled) {
            if (!("Notification" in window)) {
                alert("❌ Votre navigateur ne supporte pas les notifications");
                return;
            }
            
            Notification.requestPermission().then(permission => {
                if (permission === 'granted') {
                    notifEnabled = true;
                    localStorage.setItem('notifEnabled', 'true');
                    updateNotifBtn();
                    scheduleAllNotifications();
                    
                    // Afficher le panneau de debug
                    document.getElementById('debugPanel').classList.add('active');
                    updateDebugPanel();
                    
                    alert("✅ Notifications activées !\n\nVous recevrez des rappels pour vos médicaments.");
                } else {
                    alert("❌ Vous devez autoriser les notifications dans les paramètres de votre navigateur.");
                }
            });
        } else {
            notifEnabled = false;
            localStorage.setItem('notifEnabled', 'false');
            updateNotifBtn();
            cancelAllNotifications();
            document.getElementById('debugPanel').classList.remove('active');
            alert("🔕 Notifications désactivées");
        }
    }

    function updateNotifBtn() {
        const btn = document.getElementById('notifBtn');
        if (notifEnabled) {
            btn.classList.add('active');
            btn.title = "Notifications activées - Cliquer pour désactiver";
        } else {
            btn.classList.remove('active');
            btn.title = "Notifications désactivées - Cliquer pour activer";
        }
    }

    let scheduledNotifications = {};

    function scheduleAllNotifications() {
        // Annuler toutes les notifications existantes
        cancelAllNotifications();
        
        if (!notifEnabled) return;
        
        const today = new Date().toLocaleDateString('en-CA');
        const now = new Date();
        
        meds.forEach(m => {
            if (m.p === 'Crise') return;
            
            const diff = Math.round((parseDateLocal(today) - parseDateLocal(m.s)) / 86400000);
            if (diff < 0 || (m.d - diff) <= 0) return;
            
            const alreadyTaken = hist[today] && hist[today][m.id];
            if (alreadyTaken) return;
            
            // Créer la date/heure de notification
            const notifTime = new Date();
            const [hours, minutes] = m.t.split(':');
            notifTime.setHours(parseInt(hours), parseInt(minutes), 0, 0);
            
            const delay = notifTime - now;
            
            if (delay > 0) {
                const timeoutId = setTimeout(() => {
                    showNotification(m);
                }, delay);
                
                scheduledNotifications[m.id] = timeoutId;
                
                console.log(`📅 Notification programmée pour ${m.n} à ${m.t} (dans ${Math.round(delay/1000/60)} minutes)`);
            }
        });
        
        updateDebugPanel();
    }

    function cancelAllNotifications() {
        Object.values(scheduledNotifications).forEach(timeoutId => {
            clearTimeout(timeoutId);
        });
        scheduledNotifications = {};
    }

    function showNotification(med) {
        if (!notifEnabled) return;
        
        const title = `💊 ${med.n}`;
        const body = `Il est temps de prendre votre médicament (${med.p} - ${med.t})`;
        
        if ('serviceWorker' in navigator && navigator.serviceWorker.controller) {
            navigator.serviceWorker.controller.postMessage({
                type: 'SCHEDULE_NOTIF',
                title: title,
                body: body
            });
        } else {
            new Notification(title, {
                body: body,
                icon: '/icon-192.png',
                badge: '/icon-192.png',
                vibrate: [200, 100, 200],
                requireInteraction: false
            });
        }
        
        console.log(`🔔 Notification affichée: ${title}`);
    }

    function updateDebugPanel() {
        const debugContent = document.getElementById('debugContent');
        const now = new Date();
        const today = new Date().toLocaleDateString('en-CA');
        
        let html = `<div class="debug-info">📅 Date: ${today}</div>`;
        html += `<div class="debug-info">🕒 Heure: ${now.toLocaleTimeString('fr-FR')}</div>`;
        html += `<div class="debug-info">🔔 Statut: ${notifEnabled ? '✅ Activées' : '❌ Désactivées'}</div>`;
        html += `<div class="debug-info">📊 Notifications programmées: ${Object.keys(scheduledNotifications).length}</div>`;
        
        html += '<div style="margin-top: 10px; font-weight: bold; color: #0284c7;">Prochaines notifications:</div>';
        
        meds.forEach(m => {
            if (m.p === 'Crise') return;
            
            const diff = Math.round((parseDateLocal(today) - parseDateLocal(m.s)) / 86400000);
            if (diff < 0 || (m.d - diff) <= 0) return;
            
            const alreadyTaken = hist[today] && hist[today][m.id];
            
            const notifTime = new Date();
            const [hours, minutes] = m.t.split(':');
            notifTime.setHours(parseInt(hours), parseInt(minutes), 0, 0);
            
            const delay = notifTime - now;
            const isProgrammed = scheduledNotifications[m.id] !== undefined;
            
            html += `<div class="debug-info">
                ${alreadyTaken ? '✅' : isProgrammed ? '⏰' : '⏸️'} ${m.n} - ${m.t}
                ${alreadyTaken ? '(Pris)' : delay > 0 ? `(dans ${Math.round(delay/1000/60)}min)` : '(Passé)'}
            </div>`;
        });
        
        debugContent.innerHTML = html;
    }

    // Mettre à jour le panneau de debug toutes les 10 secondes si visible
    setInterval(() => {
        if (document.getElementById('debugPanel').classList.contains('active')) {
            updateDebugPanel();
        }
    }, 10000);

    function togglePeriod(p) {
        const btn = document.getElementById(`btn-${p}`);
        const timeRow = document.getElementById(`time-row-${p}`);
        
        if (selectedPeriods.includes(p)) {
            selectedPeriods = selectedPeriods.filter(x => x !== p);
            btn.classList.remove(`act-${p}`);
            if (timeRow) timeRow.style.display = 'none';
        } else {
            selectedPeriods.push(p);
            btn.classList.add(`act-${p}`);
            if (timeRow) timeRow.style.display = 'flex';
        }
    }

    function openForm(gid = null) {
        document.getElementById('mainUI').style.display = 'none'; 
        document.querySelectorAll('.admin-panel').forEach(p => p.style.display='none');
        document.getElementById('medPanel').style.display='block';
        
        selectedPeriods = [];
        document.querySelectorAll('.p-btn').forEach(b => b.className = 'p-btn');
        document.querySelectorAll('.time-period-row').forEach(row => row.style.display = 'none');
        
        if (gid) {
            const group = meds.filter(m => m.gid === gid);
            if (group.length) {
                document.getElementById('editGroupId').value = gid;
                document.getElementById('medName').value = group[0].n;
                document.getElementById('startDay').value = group[0].s;
                document.getElementById('jours').value = group[0].d !== 9999 ? group[0].d : 7;
                
                group.forEach(m => {
                    selectedPeriods.push(m.p);
                    const btn = document.getElementById(`btn-${m.p}`);
                    if (btn) btn.classList.add(`act-${m.p}`);
                    
                    const timeRow = document.getElementById(`time-row-${m.p}`);
                    const timeInput = document.getElementById(`time-${m.p}`);
                    if (timeRow && timeInput) {
                        timeRow.style.display = 'flex';
                        timeInput.value = m.t;
                    }
                });
            }
        } else {
            document.getElementById('editGroupId').value = '';
            document.getElementById('medName').value = '';
            document.getElementById('startDay').value = new Date().toLocaleDateString('en-CA');
            document.getElementById('jours').value = 7;
        }
    }

    function closePanels() {
        document.querySelectorAll('.admin-panel').forEach(p => p.style.display='none');
        document.getElementById('mainUI').style.display='block';
        render();
    }

    function exportData() {
        const blob = new Blob([JSON.stringify({meds, hist}, null, 2)], {type: 'application/json'});
        const a = document.createElement('a'); 
        a.href = URL.createObjectURL(blob); 
        a.download = 'suivi_medical_' + new Date().toISOString().split('T')[0] + '.json'; 
        a.click();
    }

    function saveMed() {
        const name = document.getElementById('medName').value.trim();
        const selected = selectedPeriods;
        
        if (!name) { alert('⚠️ Nom requis'); return; }
        if (selected.length === 0) { alert('⚠️ Sélectionnez au moins une période'); return; }
        
        const gid = document.getElementById('editGroupId').value ? parseFloat(document.getElementById('editGroupId').value) : Date.now();
        let existing = meds.filter(m => m.gid === gid); 
        meds = meds.filter(m => m.gid !== gid);
        
        // Définir les plages horaires autorisées (CORRIGÉ)
        const timeRanges = {
            'Matin': { min: '00:00', max: '11:59' },
            'Midi': { min: '12:00', max: '17:59' },
            'Soir': { min: '18:00', max: '23:59' },
            'Coucher': { min: '19:00', max: '23:59' }
        };
        
        // Valider les heures avant d'enregistrer
        for (let p of selected) {
            if (p === 'Crise') continue;
            
            const timeInput = document.getElementById(`time-${p}`);
            if (timeInput && timeInput.value) {
                const inputTime = timeInput.value;
                const range = timeRanges[p];
                
                if (inputTime < range.min || inputTime > range.max) {
                    alert(`❌ ERREUR: L'heure ${inputTime} n'est pas valide pour "${p}".\n\n` +
                          `Heures autorisées pour ${p}: ${range.min} - ${range.max}`);
                    return; // Annuler l'enregistrement
                }
            }
        }
        
        selected.forEach(p => {
            const old = existing.find(ex => ex.p === p);
            
            // Récupérer l'heure personnalisée si elle existe
            let customTime = null;
            let customHour = null;
            if (p !== 'Crise') {
                const timeInput = document.getElementById(`time-${p}`);
                if (timeInput && timeInput.value) {
                    customTime = timeInput.value;
                    customHour = parseInt(timeInput.value.split(':')[0]);
                }
            }
            
            // Valeurs par défaut si pas d'heure personnalisée
            const defaultHours = {'Matin':8, 'Midi':12, 'Soir':19, 'Coucher':22};
            const defaultTimes = {'Matin':'08:00', 'Midi':'12:00', 'Soir':'19:00', 'Coucher':'22:00'};
            
            meds.push({ 
                id: old ? old.id : (Date.now() + Math.random()), 
                gid: gid, 
                n: name, 
                p: p, 
                s: document.getElementById('startDay').value, 
                d: (p === 'Crise') ? 9999 : parseInt(document.getElementById('jours').value), 
                h: customHour !== null ? customHour : (old ? old.h : defaultHours[p] || 23),
                t: customTime || (old ? old.t : defaultTimes[p] || 'Libre'),
                o: old ? old.o : Date.now() 
            });
        });
        
        localStorage.setItem('meds_v18', JSON.stringify(meds)); 
        
        // Reprogrammer les notifications après modification
        if (notifEnabled) {
            scheduleAllNotifications();
        }
        
        closePanels();
    }

    function moveMed(id, dir) {
        console.log('moveMed appelé:', id, dir);
        
        // Trouver le médicament
        const medIndex = meds.findIndex(x => x.id === id);
        if (medIndex === -1) {
            console.log('Médicament non trouvé');
            return;
        }
        
        const m = meds[medIndex];
        console.log('Médicament trouvé:', m.n, 'période:', m.p);
        
        // Trouver tous les médicaments de la même période
        const samePeriodMeds = [];
        for (let i = 0; i < meds.length; i++) {
            if (meds[i].p === m.p) {
                samePeriodMeds.push({index: i, med: meds[i]});
            }
        }
        
        // Trier par ordre
        samePeriodMeds.sort((a, b) => a.med.o - b.med.o);
        
        console.log('Médicaments même période:', samePeriodMeds.length);
        
        // Trouver la position actuelle
        const currentPos = samePeriodMeds.findIndex(x => x.med.id === id);
        console.log('Position actuelle:', currentPos);
        
        if (dir === -1 && currentPos > 0) {
            // Monter : échanger avec le précédent
            const temp = meds[samePeriodMeds[currentPos].index].o;
            meds[samePeriodMeds[currentPos].index].o = meds[samePeriodMeds[currentPos - 1].index].o;
            meds[samePeriodMeds[currentPos - 1].index].o = temp;
            console.log('Échange vers le haut effectué');
        } else if (dir === 1 && currentPos < samePeriodMeds.length - 1) {
            // Descendre : échanger avec le suivant
            const temp = meds[samePeriodMeds[currentPos].index].o;
            meds[samePeriodMeds[currentPos].index].o = meds[samePeriodMeds[currentPos + 1].index].o;
            meds[samePeriodMeds[currentPos + 1].index].o = temp;
            console.log('Échange vers le bas effectué');
        } else {
            console.log('Déplacement impossible');
        }
        
        // Sauvegarder
        localStorage.setItem('meds_v18', JSON.stringify(meds));
        console.log('Sauvegarde effectuée');
        
        // Re-rendre
        render();
    }

    function showCrisePanel() {
        document.getElementById('mainUI').style.display = 'none'; 
        document.querySelectorAll('.admin-panel').forEach(p => p.style.display='none');
        document.getElementById('criseRetroDate').value = curD.toLocaleDateString('en-CA');
        const container = document.getElementById('criseChoices'); container.innerHTML = "";
        meds.filter(m => m.p === 'Crise').forEach(m => {
            const btn = document.createElement('button'); 
            btn.className = "btn-top bg-blue"; 
            btn.style.width = "100%"; 
            btn.style.marginBottom = "10px"; 
            btn.innerText = "🚨 Prise : " + m.n;
            btn.onclick = () => { 
                const d = document.getElementById('criseRetroDate').value; 
                if(!hist[d]) hist[d] = {}; 
                hist[d][m.id] = new Date().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}); 
                localStorage.setItem('hist_v18', JSON.stringify(hist)); 
                closePanels(); 
            };
            container.appendChild(btn);
        });
        document.getElementById('crisePanel').style.display = 'block';
    }

    function parseDateLocal(s) { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); }

    function render() {
        const k = curD.toLocaleDateString('en-CA');
        document.getElementById('dateDisplay').innerText = (k === new Date().toLocaleDateString('en-CA')) ? "Aujourd'hui" : curD.toLocaleDateString('fr-FR', {day:'numeric', month:'short'});
        const listDiv = document.getElementById('list'); 
        listDiv.innerHTML = "";
        meds.sort((a, b) => a.h - b.h || a.o - b.o);
        
        meds.forEach((m, index) => {
            const val = hist[k] && hist[k][m.id]; 
            if (m.p === 'Crise' && !val) return;
            const diff = Math.round((parseDateLocal(k) - parseDateLocal(m.s)) / 86400000);
            if (m.p !== 'Crise' && (diff < 0 || (m.d - diff) <= 0)) return;
            if (m.p === 'Crise' && diff < 0) return;
            const rem = m.d - diff; 
            const icon = m.p==='Matin'?'☀️':m.p==='Midi'?'🕛':m.p==='Soir'?'🌙':m.p==='Coucher'?'🛌':'🚨';
            
            // Créer la carte de médicament
            const card = document.createElement('div');
            card.className = `med-card brd-${m.p.toLowerCase()} ${val ? 'completed' : ''}`;
            
            // Utiliser un index unique pour éviter les problèmes avec les IDs décimaux
            const uniqueIdx = 'med_' + index + '_' + Date.now();
            
            card.innerHTML = `
                <input type="checkbox" class="chk" ${val?'checked':''} 
                    onchange="const d='${k}'; if(!hist[d])hist[d]={}; hist[d][${m.id}]=this.checked ? new Date().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}) : null; localStorage.setItem('hist_v18',JSON.stringify(hist)); render(); event.stopPropagation();">
                <div class="med-info">
                    <div class="med-name-row">
                        <div class="med-name">${m.n}</div>
                        <div class="order-buttons">
                            <button class="order-btn" id="up_${uniqueIdx}" type="button">↑</button>
                            <button class="order-btn" id="down_${uniqueIdx}" type="button">↓</button>
                        </div>
                    </div>
                    <div class="med-meta">
                        <span>${icon} ${m.p} • ${val ? 'Pris à ' + val : 'Prévu à ' + m.t}</span>
                        ${m.p!=='Crise'?`<span class="days-left">J-${rem}</span>`:''}
                    </div>
                </div>
            `;
            
            // Click sur la carte pour éditer
            card.addEventListener('click', function(e) {
                if(!['BUTTON','INPUT'].includes(e.target.tagName)) {
                    openForm(m.gid);
                }
            });
            
            listDiv.appendChild(card);
            
            // CRUCIAL : Attacher les événements APRÈS que la carte soit dans le DOM
            setTimeout(() => {
                const upButton = document.getElementById('up_' + uniqueIdx);
                const downButton = document.getElementById('down_' + uniqueIdx);
                
                if (upButton) {
                    upButton.onclick = function(e) {
                        e.stopPropagation();
                        e.preventDefault();
                        console.log('UP clicked for:', m.n);
                        moveMed(m.id, -1);
                        return false;
                    };
                }
                
                if (downButton) {
                    downButton.onclick = function(e) {
                        e.stopPropagation();
                        e.preventDefault();
                        console.log('DOWN clicked for:', m.n);
                        moveMed(m.id, 1);
                        return false;
                    };
                }
            }, 0);
        });
        
        updateNotifBtn();
    }
    
    // Initialisation
    updateNotifBtn();
    if (notifEnabled) {
        scheduleAllNotifications();
    }
    render();
</script>
</body>
</html>
